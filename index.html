<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  :root {
    --bg: #0f1115;
    --panel: #171922;
    --panel-2: #1f2230;
    --border: #2a2e3d;
    --text: #e8eaf2;
    --muted: #8b90a5;
    --accent: #ff7a45;
    --accent-2: #ffb088;
    --green: #4ade80;
    --yellow: #fbbf24;
    --blue: #60a5fa;
    --purple: #a78bfa;
    --radius: 12px;
  }
  html, body {
    background: radial-gradient(1200px 800px at 80% -10%, #1a1d2c 0%, var(--bg) 60%) fixed;
    color: var(--text);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "Inter", system-ui, sans-serif;
    line-height: 1.55;
    min-height: 100vh;
  }
  .app {
    display: grid;
    grid-template-columns: 280px 1fr;
    min-height: 100vh;
  }
  /* Sidebar */
  .sidebar {
    background: var(--panel);
    border-right: 1px solid var(--border);
    padding: 24px 16px;
    position: sticky; top: 0; height: 100vh; overflow-y: auto;
  }
  .brand {
    font-size: 18px; font-weight: 700; margin-bottom: 4px;
    display: flex; align-items: center; gap: 8px;
  }
  .brand .dot { width: 10px; height: 10px; background: var(--accent); border-radius: 50%; box-shadow: 0 0 16px var(--accent); }
  .tagline { color: var(--muted); font-size: 12px; margin-bottom: 20px; }
  .nav { display: flex; flex-direction: column; gap: 2px; }
  .nav button {
    background: transparent; color: var(--text); border: 0; text-align: left;
    padding: 9px 12px; border-radius: 8px; cursor: pointer;
    font-size: 13.5px; display: flex; justify-content: space-between; align-items: center;
    transition: background .15s ease;
  }
  .nav button:hover { background: var(--panel-2); }
  .nav button.active { background: var(--accent); color: #1a0d05; font-weight: 600; }
  .nav button .count { font-size: 11px; opacity: .7; }
  .nav button.active .count { opacity: .8; }
  .nav-section { color: var(--muted); font-size: 11px; text-transform: uppercase; letter-spacing: .08em; margin: 14px 8px 6px; }
  .progress-card {
    background: var(--panel-2); border: 1px solid var(--border); border-radius: var(--radius);
    padding: 14px; margin-bottom: 16px;
  }
  .progress-card h4 { font-size: 12px; color: var(--muted); text-transform: uppercase; letter-spacing: .08em; margin-bottom: 8px; }
  .progress-bar { height: 6px; background: var(--panel); border-radius: 999px; overflow: hidden; margin: 8px 0 6px; }
  .progress-bar > div { height: 100%; background: linear-gradient(90deg, var(--accent), var(--accent-2)); transition: width .3s ease; }
  .progress-stats { font-size: 12px; color: var(--muted); display: flex; justify-content: space-between; }
  .progress-stats b { color: var(--text); }

  /* Main */
  .main { padding: 28px 36px 80px; max-width: 1100px; }
  .header {
    display: flex; justify-content: space-between; align-items: flex-end; gap: 16px;
    margin-bottom: 22px; flex-wrap: wrap;
  }
  h1 { font-size: 26px; font-weight: 700; }
  h1 .sub { color: var(--muted); font-weight: 400; font-size: 14px; margin-left: 8px; }
  .toolbar { display: flex; gap: 8px; flex-wrap: wrap; }
  .toolbar input, .toolbar select, .toolbar button {
    background: var(--panel); color: var(--text); border: 1px solid var(--border);
    padding: 8px 12px; border-radius: 8px; font-size: 13px; outline: none;
  }
  .toolbar input { width: 220px; }
  .toolbar input::placeholder { color: var(--muted); }
  .toolbar input:focus, .toolbar select:focus { border-color: var(--accent); }
  .toolbar button { cursor: pointer; transition: background .15s; }
  .toolbar button:hover { background: var(--panel-2); }
  .toolbar button.primary { background: var(--accent); color: #1a0d05; border-color: var(--accent); font-weight: 600; }
  .toolbar button.primary:hover { background: var(--accent-2); }

  .modes { display: flex; gap: 0; background: var(--panel); border: 1px solid var(--border); border-radius: 8px; padding: 3px; margin-bottom: 22px; width: fit-content; }
  .modes button {
    background: transparent; border: 0; color: var(--muted); padding: 7px 14px;
    border-radius: 6px; font-size: 13px; cursor: pointer; transition: all .15s;
  }
  .modes button.active { background: var(--accent); color: #1a0d05; font-weight: 600; }
  .modes button:not(.active):hover { color: var(--text); }

  /* Phrase list */
  .phrase-list { display: grid; gap: 12px; }
  .phrase {
    background: var(--panel); border: 1px solid var(--border); border-radius: var(--radius);
    padding: 16px 18px; transition: border-color .15s;
  }
  .phrase:hover { border-color: var(--accent); }
  .phrase.learned { opacity: .55; }
  .phrase-top { display: flex; justify-content: space-between; gap: 12px; margin-bottom: 8px; }
  .phrase-en { font-size: 16px; font-weight: 600; color: var(--text); }
  .phrase-uk { color: var(--muted); font-size: 14px; margin-bottom: 8px; }
  .phrase-meta { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
  .badge { font-size: 11px; padding: 3px 8px; border-radius: 999px; border: 1px solid var(--border); color: var(--muted); }
  .badge.b1 { color: var(--green); border-color: var(--green); }
  .badge.b1plus, .badge.b1\+ { color: var(--yellow); border-color: var(--yellow); }
  .badge.b2 { color: var(--purple); border-color: var(--purple); }
  .badge.cat { color: var(--blue); border-color: var(--blue); }
  .phrase-context { color: var(--muted); font-size: 13px; margin: 8px 0 4px; font-style: italic; }
  .phrase-example {
    background: var(--panel-2); border-left: 3px solid var(--accent);
    padding: 10px 12px; border-radius: 6px; font-size: 13.5px; margin-top: 8px;
  }
  .phrase-example b { color: var(--accent-2); }
  .phrase-actions { display: flex; gap: 8px; margin-top: 10px; }
  .icon-btn {
    background: transparent; border: 1px solid var(--border); color: var(--muted);
    padding: 5px 10px; border-radius: 6px; font-size: 12px; cursor: pointer; transition: all .15s;
  }
  .icon-btn:hover { color: var(--text); border-color: var(--accent); }
  .icon-btn.active { background: var(--green); color: #052e10; border-color: var(--green); }
  .speak-btn {
    background: transparent; border: 1px solid var(--border); color: var(--blue);
    padding: 5px 10px; border-radius: 6px; font-size: 13px; cursor: pointer;
    transition: all .15s; display: inline-flex; align-items: center; gap: 4px;
  }
  .speak-btn:hover { background: rgba(96, 165, 250, .1); border-color: var(--blue); }
  .speak-btn.speaking { background: var(--blue); color: #04132e; }
  .voice-controls { display: flex; gap: 6px; align-items: center; font-size: 12px; color: var(--muted); }
  .voice-controls select { padding: 4px 8px; font-size: 12px; }

  /* Flashcard mode */
  .flashcard-wrap { display: flex; flex-direction: column; align-items: center; gap: 18px; }
  .flashcard {
    background: var(--panel); border: 1px solid var(--border); border-radius: 16px;
    width: 100%; max-width: 640px; min-height: 320px;
    padding: 36px; display: flex; flex-direction: column; justify-content: center; align-items: center;
    cursor: pointer; transition: transform .2s, border-color .15s;
    text-align: center;
  }
  .flashcard:hover { border-color: var(--accent); }
  .flashcard.flipped { background: linear-gradient(135deg, var(--panel) 0%, var(--panel-2) 100%); }
  .flashcard .face-en { font-size: 24px; font-weight: 600; }
  .flashcard .face-uk { font-size: 20px; color: var(--accent-2); }
  .flashcard .face-context { color: var(--muted); font-size: 13px; margin-top: 12px; font-style: italic; }
  .flashcard .face-example { background: var(--bg); padding: 10px 14px; border-radius: 8px; margin-top: 14px; font-size: 13px; max-width: 100%; }
  .flashcard-controls { display: flex; gap: 10px; }
  .flashcard-counter { color: var(--muted); font-size: 13px; }

  /* Quiz mode */
  .quiz-card {
    background: var(--panel); border: 1px solid var(--border); border-radius: 16px;
    max-width: 640px; margin: 0 auto; padding: 28px;
  }
  .quiz-prompt-label { color: var(--muted); font-size: 12px; text-transform: uppercase; letter-spacing: .08em; margin-bottom: 8px; }
  .quiz-prompt { font-size: 20px; font-weight: 600; margin-bottom: 18px; }
  .quiz-input {
    width: 100%; background: var(--panel-2); border: 1px solid var(--border);
    color: var(--text); padding: 12px 14px; border-radius: 8px; font-size: 15px;
    font-family: inherit;
  }
  .quiz-input:focus { border-color: var(--accent); outline: none; }
  .quiz-feedback { margin-top: 14px; padding: 12px 14px; border-radius: 8px; font-size: 14px; display: none; }
  .quiz-feedback.show { display: block; }
  .quiz-feedback.correct { background: rgba(74, 222, 128, .12); border: 1px solid var(--green); color: var(--green); }
  .quiz-feedback.incorrect { background: rgba(255, 122, 69, .12); border: 1px solid var(--accent); color: var(--accent-2); }
  .quiz-feedback .answer { color: var(--text); margin-top: 6px; font-size: 13px; }

  /* Dialogue snippets */
  .dialogue {
    background: var(--panel); border: 1px solid var(--border); border-radius: var(--radius);
    padding: 18px 20px; margin-bottom: 14px;
  }
  .dialogue h3 { font-size: 15px; margin-bottom: 4px; }
  .dialogue .scenario { color: var(--muted); font-size: 13px; margin-bottom: 12px; font-style: italic; }
  .dialogue .turn { display: flex; gap: 10px; margin-bottom: 8px; align-items: flex-start; }
  .dialogue .who {
    flex-shrink: 0; width: 60px; font-size: 12px; color: var(--muted);
    text-transform: uppercase; letter-spacing: .05em; padding-top: 2px;
  }
  .dialogue .who.you { color: var(--accent); }
  .dialogue .text { color: var(--text); font-size: 14px; }
  .dialogue .text .hl { background: rgba(255, 122, 69, .15); color: var(--accent-2); padding: 1px 4px; border-radius: 3px; }

  .empty { text-align: center; color: var(--muted); padding: 60px 20px; }
  .footer { color: var(--muted); font-size: 12px; text-align: center; margin-top: 40px; }

  @media (max-width: 768px) {
    .app { grid-template-columns: 1fr; }
    .sidebar { position: static; height: auto; border-right: 0; border-bottom: 1px solid var(--border); }
    .main { padding: 20px; }
    .toolbar input { width: 100%; }
  }
</style>
</head>
<body>
<div class="app">
  <aside class="sidebar">
    <div class="brand"><span class="dot"></span> Client English</div>
    <div class="tagline">PPC / Marketing · B1 → B2</div>

    <div class="progress-card">
      <h4>Прогрес</h4>
      <div class="progress-bar"><div id="progressFill" style="width:0%"></div></div>
      <div class="progress-stats">
        <span><b id="learnedCount">0</b> / <span id="totalCount">0</span> вивчено</span>
        <span id="progressPercent">0%</span>
      </div>
    </div>

    <div class="nav-section">Категорії</div>
    <div class="nav" id="categoryNav"></div>

    <div class="nav-section" style="margin-top: 18px;">Дія</div>
    <div class="nav">
      <button onclick="resetProgress()" style="color: var(--accent);">↺ Скинути прогрес</button>
    </div>
  </aside>

  <main class="main">
    <div class="header">
      <h1>Client English Trainer <span class="sub">PPC · Marketing · Creative</span></h1>
    </div>

    <div class="toolbar">
      <input id="search" type="text" placeholder="Пошук фраз (en / uk)…" oninput="render()" />
      <select id="levelFilter" onchange="render()">
        <option value="">Всі рівні</option>
        <option value="B1">B1</option>
        <option value="B1+">B1+</option>
        <option value="B2">B2</option>
      </select>
      <select id="learnedFilter" onchange="render()">
        <option value="">Всі</option>
        <option value="unlearned">Тільки невивчені</option>
        <option value="learned">Тільки вивчені</option>
      </select>
      <button onclick="randomPhrase()">🎲 Випадкова фраза</button>
      <div class="voice-controls" style="margin-left: auto;">
        <span>🔊</span>
        <select id="voiceSelect" onchange="state.voiceURI = this.value; localStorage.setItem('voice_uri', this.value);"></select>
        <select id="rateSelect" onchange="state.speechRate = parseFloat(this.value); localStorage.setItem('voice_rate', this.value);">
          <option value="0.8">0.8x</option>
          <option value="0.9">0.9x</option>
          <option value="1" selected>1x</option>
          <option value="1.1">1.1x</option>
        </select>
      </div>
    </div>

    <div class="modes">
      <button class="active" onclick="setMode('list', event)">📚 Список</button>
      <button onclick="setMode('flashcards', event)">🃏 Картки</button>
      <button onclick="setMode('quiz', event)">✍️ Квіз</button>
      <button onclick="setMode('dialogues', event)">💬 Діалоги</button>
    </div>

    <div id="content"></div>

    <div class="footer">
      Прогрес зберігається у браузері (localStorage). Працює оффлайн.
    </div>
  </main>
</div>

<script>
/* ============ DATA ============ */
const PHRASES = [
  // ====== EMAIL & CHAT OPENERS ======
  { id: 1, cat: "Openers", lvl: "B1", en: "Hope you're doing well.", uk: "Сподіваюсь, у вас все добре.", ctx: "Класичний відкривач email/повідомлення в понеділок або після паузи", ex: "Hi Sarah, hope you're doing well. Wanted to share an update on the Search campaign…" },
  { id: 2, cat: "Openers", lvl: "B1", en: "Just a quick note to…", uk: "Просто короткий апдейт щоб…", ctx: "Коли пишеш короткий апдейт, не хочеш забирати багато часу", ex: "Just a quick note to flag that the Merchant Center feed is now approved." },
  { id: 3, cat: "Openers", lvl: "B1+", en: "Following up on my previous message,", uk: "На продовження мого попереднього повідомлення,", ctx: "Коли клієнт не відповів і треба нагадати без агресії", ex: "Following up on my previous message — did you get a chance to review the keyword list?" },
  { id: 4, cat: "Openers", lvl: "B1+", en: "Circling back on this.", uk: "Повертаюся до цього питання.", ctx: "Дуже корпоративна фраза для повторного нагадування", ex: "Circling back on this — any thoughts on the new bidding strategy?" },
  { id: 5, cat: "Openers", lvl: "B2", en: "Touching base regarding…", uk: "Виходжу на зв'язок щодо…", ctx: "Натуральне ділове відкриття, особливо для перевірок-апдейтів", ex: "Hi Mark, touching base regarding the Q2 budget allocation." },
  { id: 6, cat: "Openers", lvl: "B1", en: "Thanks for getting back to me.", uk: "Дякую що відповіли.", ctx: "Після того як клієнт відповів — тепла ввічливість", ex: "Thanks for getting back to me — really helpful context." },
  { id: 7, cat: "Openers", lvl: "B1", en: "Wanted to share a quick update.", uk: "Хотіла поділитися коротким оновленням.", ctx: "Перед звітом про прогрес", ex: "Wanted to share a quick update on where we are with the PMax launch." },
  { id: 8, cat: "Openers", lvl: "B2", en: "I'll keep this brief.", uk: "Буду коротка.", ctx: "Коли поважаєш час клієнта і одразу до суті", ex: "I'll keep this brief — three things came up this week that need your input." },

  // ====== STATUS UPDATES ======
  { id: 10, cat: "Status updates", lvl: "B1", en: "Here's where we are:", uk: "Ось на якому ми етапі:", ctx: "Перед списком апдейтів — структуроване відкриття", ex: "Here's where we are: keyword research is done, ad copy is in review, launch is scheduled for Monday." },
  { id: 11, cat: "Status updates", lvl: "B1", en: "Things are moving along nicely.", uk: "Все рухається в хорошому темпі.", ctx: "Загальна позитивна картинка для клієнта", ex: "Things are moving along nicely — we're on track for the Friday launch." },
  { id: 12, cat: "Status updates", lvl: "B1+", en: "We're on track to wrap up by [date].", uk: "Ми вкладаємось в дедлайн до [дата].", ctx: "Підтвердження що дедлайн реалістичний", ex: "We're on track to wrap up the audit by end of next week." },
  { id: 13, cat: "Status updates", lvl: "B1+", en: "Currently in the works.", uk: "Зараз в роботі.", ctx: "Коротко описати поточну задачу", ex: "The new ad creatives are currently in the works — should be ready by Thursday." },
  { id: 14, cat: "Status updates", lvl: "B2", en: "We've made significant progress on…", uk: "Ми досягли значного прогресу в…", ctx: "Більш формально — для звіту або щотижневого summary", ex: "We've made significant progress on restructuring the Search campaigns." },
  { id: 15, cat: "Status updates", lvl: "B1", en: "It's pretty much ready.", uk: "Вже майже готово.", ctx: "Неформально, у чаті — щоб клієнт знав що чекати недовго", ex: "The dashboard is pretty much ready — just doing final QA." },
  { id: 16, cat: "Status updates", lvl: "B1+", en: "We hit a small snag with…", uk: "Ми трохи затрималися на…", ctx: "Чесно сказати про невелику проблему без драми", ex: "We hit a small snag with the feed approval, but it's resolved now." },
  { id: 17, cat: "Status updates", lvl: "B2", en: "We're putting the finishing touches on it.", uk: "Доводимо до досконалості.", ctx: "На фінальній стадії, лишилися деталі", ex: "We're putting the finishing touches on the Q2 report — sending it over today." },

  // ====== ASKING QUESTIONS / CLARIFICATION ======
  { id: 20, cat: "Clarification", lvl: "B1", en: "Could you clarify what you mean by…?", uk: "Можеш уточнити що ти маєш на увазі під…?", ctx: "Ввічливо просити деталей коли щось незрозуміло", ex: "Could you clarify what you mean by 'aggressive scaling' — are we talking 50% increase or 2x?" },
  { id: 21, cat: "Clarification", lvl: "B1", en: "Just to make sure I've got this right,", uk: "Просто щоб переконатися що я зрозуміла правильно,", ctx: "Перефразувати щоб підтвердити розуміння", ex: "Just to make sure I've got this right — you'd like the campaign paused, not deleted?" },
  { id: 22, cat: "Clarification", lvl: "B1+", en: "Could you walk me through it?", uk: "Можеш пояснити покроково?", ctx: "Просити детальніше пояснення процесу", ex: "Could you walk me through how you want the lead routing to work?" },

  { id: 124, cat: "Email formal", lvl: "B2", en: "I'll defer to your judgment on this.", uk: "Покладаюся на твоє рішення в цьому питанні.", ctx: "Передати остаточний вибір клієнту", ex: "Both options have trade-offs — I'll defer to your judgment on this." },
  { id: 125, cat: "Email formal", lvl: "B1+", en: "For your reference,", uk: "Для довідки,", ctx: "Перед прикріпленням контекстної інфи", ex: "For your reference, here's the link to the previous month's report." },
  { id: 126, cat: "Email formal", lvl: "B2", en: "I'll loop in [name] for visibility.", uk: "Додаю [ім'я] в копію для прозорості.", ctx: "Включити іншу людину в обговорення", ex: "I'll loop in our dev lead Sarah for visibility on the tracking issue." },

  // ====== APOLOGIES & ACKNOWLEDGMENTS ======
  { id: 130, cat: "Apologies", lvl: "B1", en: "My apologies for the confusion.", uk: "Перепрошую за плутанину.", ctx: "Коли власне повідомлення було незрозумілим", ex: "My apologies for the confusion — let me clarify what I meant." },
  { id: 131, cat: "Apologies", lvl: "B1+", en: "That's on me.", uk: "Це моя помилка.", ctx: "Коротке і чесне визнання помилки", ex: "Looks like the negative keyword wasn't applied — that's on me, fixing it now." },
  { id: 132, cat: "Apologies", lvl: "B2", en: "I should have caught that earlier.", uk: "Мала помітити це раніше.", ctx: "Самокритично визнати недогляд", ex: "I should have caught that earlier — sorry it slipped through QA." },
  { id: 133, cat: "Apologies", lvl: "B1+", en: "Thanks for your patience.", uk: "Дякую за терпіння.", ctx: "Після того як клієнт чекав", ex: "Got the report ready — thanks for your patience." },
  { id: 134, cat: "Apologies", lvl: "B2", en: "I appreciate you bringing this to my attention.", uk: "Дякую що звернув на це мою увагу.", ctx: "Формальне визнання що щось важливе помітили", ex: "I appreciate you bringing this to my attention — investigating now." },
  { id: 135, cat: "Apologies", lvl: "B1+", en: "Won't happen again.", uk: "Більше не повториться.", ctx: "Коротке зобов'язання після помилки", ex: "Tightening up the QA process — won't happen again." },

  // ====== PPC / MARKETING TERMINOLOGY ======
  { id: 140, cat: "PPC vocab", lvl: "B1", en: "Bidding strategy", uk: "Стратегія ставок", ctx: "Як алгоритм виставляє ставки (tCPA, tROAS, Max Conversions)", ex: "We need to switch the bidding strategy to tROAS once we hit 30 conversions." },
  { id: 141, cat: "PPC vocab", lvl: "B1+", en: "Cannibalisation", uk: "Канібалізація трафіку", ctx: "Коли одна кампанія краде покази/кліки в іншої", ex: "There's some cannibalisation between Brand and PMax — let's add brand exclusions." },
  { id: 142, cat: "PPC vocab", lvl: "B1", en: "Match types (broad / phrase / exact)", uk: "Типи відповідності ключових слів", ctx: "Як близько запит має співпадати з ключем", ex: "Let's pull broad match into phrase and tighten the search terms." },
  { id: 143, cat: "PPC vocab", lvl: "B1+", en: "Negative keywords", uk: "Мінус-слова", ctx: "Слова за якими ти НЕ хочеш показуватись", ex: "I'm building out a negative keyword list — already at 200 added this week." },
  { id: 144, cat: "PPC vocab", lvl: "B2", en: "Search Impression Share (SIS) / Lost IS", uk: "Частка показів у пошуку / Втрачена IS", ctx: "% показів які кампанія отримує проти всіх можливих", ex: "We're losing 40% IS to budget — there's room to scale." },
  { id: 145, cat: "PPC vocab", lvl: "B1+", en: "Quality Score", uk: "Показник якості", ctx: "Оцінка релевантності ключа/реклами/LP від Google", ex: "Quality Score on the main keyword dropped to 5 — we need new ad copy." },
  { id: 146, cat: "PPC vocab", lvl: "B1", en: "Click-through rate (CTR)", uk: "Коефіцієнт кліків", ctx: "Кліки / Покази", ex: "CTR is up 14% week over week — the new headlines are working." },
  { id: 147, cat: "PPC vocab", lvl: "B2", en: "Assisted conversions", uk: "Допоміжні конверсії", ctx: "Конверсії де канал брав участь у воронці але не був останнім", ex: "Display has weak last-click but high assisted conversions — don't kill it yet." },
  { id: 148, cat: "PPC vocab", lvl: "B1+", en: "Account audit", uk: "Аудит акаунту", ctx: "Структурний аналіз акаунту на проблеми/можливості", ex: "I'll run a full account audit before we propose the new structure." },
  { id: 149, cat: "PPC vocab", lvl: "B1+", en: "Feed (Merchant Center)", uk: "Фід продуктів", ctx: "Файл з продуктами для Shopping/PMax кампаній", ex: "We need to clean up the feed — 12 products are disapproved." },
  { id: 150, cat: "PPC vocab", lvl: "B2", en: "Incrementality", uk: "Інкрементальність", ctx: "Чи дійсно канал генерує додаткові продажі", ex: "We should run an incrementality test on Brand — half the conversions might be organic anyway." },
  { id: 151, cat: "PPC vocab", lvl: "B1+", en: "A/B test (split test)", uk: "A/B тест", ctx: "Порівняння двох варіантів", ex: "Let's A/B test the two landing page variants for two weeks." },

  // ====== HEDGING & SOFTENERS ======
  { id: 160, cat: "Hedging", lvl: "B1+", en: "It seems like…", uk: "Здається, що…", ctx: "Не категорично — припущення на основі даних", ex: "It seems like the new creative is driving most of the lift." },
  { id: 161, cat: "Hedging", lvl: "B1+", en: "Based on what I'm seeing,", uk: "Виходячи з того, що я бачу,", ctx: "Прив'язка висновку до даних — професійно", ex: "Based on what I'm seeing, the issue is the audience overlap, not the creative." },
  { id: 162, cat: "Hedging", lvl: "B2", en: "I'd say it's likely that…", uk: "Я б сказала, що скоріше за все…", ctx: "Висловити ймовірне без 100% впевненості", ex: "I'd say it's likely that the dip is seasonal, but let's monitor for another week." },
  { id: 163, cat: "Hedging", lvl: "B1+", en: "Off the top of my head,", uk: "Зходу/без перевірки,", ctx: "Перед швидкою відповіддю без перевірки даних", ex: "Off the top of my head, CPA was around $42, but let me confirm." },
  { id: 164, cat: "Hedging", lvl: "B2", en: "I could be wrong, but…", uk: "Можу помилятись, але…", ctx: "Скромно ввести свою думку", ex: "I could be wrong, but I think the tracking pixel was changed last sprint." },
  { id: 165, cat: "Hedging", lvl: "B1+", en: "From what I can tell,", uk: "Наскільки я можу судити,", ctx: "Висновок з обмеженою інформацією", ex: "From what I can tell, the drop started right after the feed update." },

  // ====== CONNECTORS / DISCOURSE MARKERS ======
  { id: 170, cat: "Connectors", lvl: "B1", en: "That said,", uk: "Тим не менше,", ctx: "Перехід до контрастної думки після пояснення", ex: "Display ROAS is low. That said, it's pulling its weight on assisted conversions." },
  { id: 171, cat: "Connectors", lvl: "B1+", en: "Having said that,", uk: "Сказавши це,", ctx: "Те ж саме — введення нюансу/контрасту", ex: "PMax is performing well. Having said that, we should keep an eye on brand cannibalisation." },
  { id: 172, cat: "Connectors", lvl: "B1+", en: "On top of that,", uk: "Окрім того,", ctx: "Додавання до попереднього аргументу", ex: "CTR is up. On top of that, CPC dropped by 8 cents — strong signal." },
  { id: 173, cat: "Connectors", lvl: "B1", en: "In other words,", uk: "Іншими словами,", ctx: "Перефразувати щоб було зрозуміло", ex: "Conversions are flat but CPA is down. In other words, we're getting the same volume cheaper." },
  { id: 174, cat: "Connectors", lvl: "B1+", en: "Long story short,", uk: "Якщо коротко,", ctx: "Перейти до головного без деталей", ex: "Long story short — the feed is fixed and Shopping is back live." },
  { id: 175, cat: "Connectors", lvl: "B2", en: "Going forward,", uk: "Надалі,", ctx: "Перейти до планів на майбутнє", ex: "Going forward, let's review performance every Monday and reallocate accordingly." },
  { id: 176, cat: "Connectors", lvl: "B2", en: "All things considered,", uk: "Враховуючи все,", ctx: "Підсумок з врахуванням різних факторів", ex: "All things considered, the launch went smoothly despite the feed delay." },
  { id: 177, cat: "Connectors", lvl: "B1+", en: "For what it's worth,", uk: "Для контексту, / Як на мене,", ctx: "Перед своєю думкою — скромно", ex: "For what it's worth, similar accounts saw a 2-week ramp-up before PMax stabilised." },
  { id: 178, cat: "Connectors", lvl: "B1+", en: "By the same token,", uk: "Тією ж логікою,", ctx: "Проводити паралель — ідея ⇒ висновок", ex: "We're cutting Display because of low ROAS. By the same token, we should reassess YouTube." },
  { id: 179, cat: "Connectors", lvl: "B2", en: "More to the point,", uk: "Точніше кажучи, / Що важливіше,", ctx: "Перейти до головного аргументу", ex: "Yes, the budget is tight — but more to the point, we don't have the data to justify scaling yet." },

  // ====== CASUAL / RAPPORT BUILDING ======
  { id: 190, cat: "Rapport", lvl: "B1", en: "How's your week going?", uk: "Як проходить твій тиждень?", ctx: "Дружнє відкриття у чаті/мітингу", ex: "Hi Mark — how's your week going? Quick update on the launch…" },
  { id: 191, cat: "Rapport", lvl: "B1+", en: "Hope you had a good weekend.", uk: "Сподіваюсь у тебе були гарні вихідні.", ctx: "Стандартний відкривач в понеділок", ex: "Morning Sarah — hope you had a good weekend!" },
  { id: 192, cat: "Rapport", lvl: "B1+", en: "No worries at all.", uk: "Все нормально, без проблем.", ctx: "Дружньо відмахнутись від чужих перепрошень", ex: "Re: late reply — no worries at all, I know you've been heads down." },
  { id: 193, cat: "Rapport", lvl: "B1+", en: "That makes total sense.", uk: "Це абсолютно логічно.", ctx: "Підтвердити що зрозуміла позицію клієнта", ex: "That makes total sense — let's go with your approach." },
  { id: 194, cat: "Rapport", lvl: "B2", en: "I appreciate the context.", uk: "Дякую за контекст.", ctx: "Після того як клієнт пояснив фон", ex: "I appreciate the context — that changes my thinking on the budget split." },
  { id: 195, cat: "Rapport", lvl: "B1+", en: "Heads down on a deadline.", uk: "Сиджу зосереджено над дедлайном.", ctx: "Пояснити чому повільно відповідаєш", ex: "Sorry for the delay — was heads down on the audit deadline." },
  { id: 196, cat: "Rapport", lvl: "B2", en: "Let's not overcomplicate this.", uk: "Давай не будемо це ускладнювати.", ctx: "Повернути обговорення до простішого рішення", ex: "Let's not overcomplicate this — we can start with one campaign and scale from there." },

  // ====== MARKETING COLLOCATIONS ======
  { id: 200, cat: "Collocations", lvl: "B1+", en: "drive traffic / drive results / drive growth", uk: "генерувати трафік / результати / ріст", ctx: "Verb 'drive' — найпотужніший маркетинговий дієслово. Завжди йде з абстрактним результатом", ex: "The new ad copy is driving significantly more qualified traffic than the old one." },
  { id: 201, cat: "Collocations", lvl: "B1+", en: "generate leads / generate demand / generate buzz", uk: "генерувати ліди / попит / шум навколо бренду", ctx: "Класичні функціональні зв'язки в lead-gen маркетингу", ex: "We need to generate more demand at the top of the funnel before optimising mid-funnel." },
  { id: 202, cat: "Collocations", lvl: "B1+", en: "build awareness / build a pipeline / build momentum", uk: "будувати впізнаваність / пайплайн / імпульс", ctx: "'Build' = поступово створювати щось довгостроково", ex: "It'll take 4–6 weeks to build awareness before we expect conversions to lift." },
  { id: 203, cat: "Collocations", lvl: "B2", en: "move the needle", uk: "рухати голку (= відчутно вплинути на показники)", ctx: "ТОП-1 маркетингова ідіома. Означає 'дати помітний результат'", ex: "Optimising button colour won't move the needle — let's redesign the whole landing page." },
  { id: 204, cat: "Collocations", lvl: "B1+", en: "hit a target / miss the mark / fall short", uk: "досягти цілі / промахнутися / не дотягнути", ctx: "Базовий триплет дієслів про досягнення KPI", ex: "We hit our CPA target but fell short on volume by about 15%." },
  { id: 205, cat: "Collocations", lvl: "B2", en: "raise the bar / set the bar high", uk: "підняти планку", ctx: "Про якість роботи або очікування", ex: "Their last campaign really raised the bar for what we should be delivering." },
  { id: 206, cat: "Collocations", lvl: "B2", en: "gain traction", uk: "набирати оберти / починати працювати", ctx: "Про ідею, продукт або кампанію яка починає давати результати", ex: "The new creative is finally gaining traction — CTR is up 22% over the past week." },
  { id: 207, cat: "Collocations", lvl: "B2", en: "bridge the gap (between X and Y)", uk: "закрити розрив (між X та Y)", ctx: "Про з'єднання двох речей або заповнення прогалини", ex: "The new dashboard bridges the gap between Search performance and revenue attribution." },
  { id: 208, cat: "Collocations", lvl: "B1+", en: "boost / lift / spike conversions", uk: "підвищити / підняти / стрибково збільшити конверсії", ctx: "Boost = підняти стабільно; lift = + у короткостроковому періоді; spike = різкий стрибок", ex: "The seasonal promo gave us a 40% spike in conversions over three days." },
  { id: 209, cat: "Collocations", lvl: "B1+", en: "tap into a market / tap into demand", uk: "увійти в ринок / використати попит", ctx: "Про використання нових можливостей", ex: "PMax lets us tap into demand we weren't capturing through Search alone." },
  { id: 210, cat: "Collocations", lvl: "B2", en: "make a dent (in something)", uk: "помітно вплинути / 'зробити вмятину'", ctx: "Менше за 'move the needle', але реальний прогрес", ex: "We're making a dent in the wasted spend issue — down 8% MoM." },
  { id: 211, cat: "Collocations", lvl: "B1+", en: "scale (a campaign / a budget / spend)", uk: "масштабувати кампанію / бюджет / витрати", ctx: "Найбільш вживане дієслово в performance marketing", ex: "Once we hit 30 conversions per week, we can scale the budget by 30%." },
  { id: 212, cat: "Collocations", lvl: "B2", en: "stretch a budget", uk: "розтягнути бюджет / ефективно використати обмежений бюджет", ctx: "Коли ресурси обмежені — отримати максимум", ex: "We need to stretch the Q3 budget further — let's pause low-performing keywords." },
  { id: 213, cat: "Collocations", lvl: "B2", en: "trim / cut / slash spend", uk: "підрізати / скоротити / різко обрізати витрати", ctx: "Trim = акуратно; cut = просто; slash = агресивно", ex: "Let's trim spend on Display and reinvest in Search where ROAS is stronger." },
  { id: 214, cat: "Collocations", lvl: "B2", en: "the lion's share (of budget / traffic)", uk: "левова частка (бюджету / трафіку)", ctx: "Найбільша частина чогось", ex: "Search takes the lion's share of our budget — about 65%." },
  { id: 215, cat: "Collocations", lvl: "B1+", en: "see strong / weak / mixed performance", uk: "показувати сильні / слабкі / змішані результати", ctx: "Універсальний коментар по даних", ex: "Brand campaigns are seeing strong performance, but generic terms are mixed." },
  { id: 216, cat: "Collocations", lvl: "B2", en: "double down on (something)", uk: "удвічі вкластися в / зробити подвійну ставку на", ctx: "Інвестувати ще більше в те що працює", ex: "PMax is delivering — let's double down on it next quarter." },
  { id: 217, cat: "Collocations", lvl: "B1+", en: "lean into (something)", uk: "робити ставку на / занурюватись в", ctx: "Менше ніж 'double down', але вибір напрямку", ex: "We should lean into video creative — that's where audiences are responding." },
  { id: 218, cat: "Collocations", lvl: "B2", en: "low-hanging fruit", uk: "те що легко зірвати (= найпростіші покращення)", ctx: "Топ-ідіома агенцій. Прості зміни що дають швидкий результат", ex: "Before we do a full audit, let's grab the low-hanging fruit — adding negative keywords would save 12% right now." },
  { id: 219, cat: "Collocations", lvl: "B2", en: "diminishing returns", uk: "спадна віддача", ctx: "Економічний термін — більше витрат не дає більше результату", ex: "We're hitting diminishing returns at $5K/day on Brand — anything above gets wasted." },
  { id: 220, cat: "Collocations", lvl: "B2", en: "a deep dive (into something)", uk: "глибоке занурення / детальний аналіз", ctx: "Більш ретельний за 'analysis' аналіз", ex: "I'll do a deep dive into the search term report and send findings tomorrow." },
  { id: 221, cat: "Collocations", lvl: "B2", en: "a quick win", uk: "швидкий виграш / легка перемога", ctx: "Маленька оптимізація з негайним ефектом", ex: "Quick win for next week: turn off ads on Sundays where ROAS is half." },
  { id: 222, cat: "Collocations", lvl: "B2", en: "a no-brainer", uk: "очевидне рішення / 'без мозку зрозуміло'", ctx: "Коли вибір очевидний — без сумнівів", ex: "Pausing ads with negative ROAS is a no-brainer — should have been done last month." },
  { id: 223, cat: "Collocations", lvl: "B2", en: "a game-changer", uk: "переломний момент / правило-змінювач", ctx: "Щось що кардинально змінює ситуацію", ex: "Switching to tROAS bidding has been a game-changer for this account." },
  { id: 224, cat: "Collocations", lvl: "B1+", en: "moving parts", uk: "рухомі частини / складові процесу", ctx: "Багато речей що працюють разом — натяк на складність", ex: "There are a lot of moving parts here — let me schedule a call to walk through it." },
  { id: 225, cat: "Collocations", lvl: "B2", en: "a ballpark figure / a ballpark estimate", uk: "приблизна оцінка / 'на око'", ctx: "Грубий розрахунок без точних даних", ex: "Just a ballpark figure — I'd say we're looking at $8–12K extra spend to scale properly." },
  { id: 226, cat: "Collocations", lvl: "B2", en: "table stakes", uk: "базовий мінімум / 'плата за вхід'", ctx: "Те що мусить бути зроблено за замовчуванням, не перевага", ex: "Negative keyword hygiene is table stakes — every account should have this dialed in." },
  { id: 227, cat: "Collocations", lvl: "B2", en: "north star metric", uk: "головна метрика / 'путівна зірка'", ctx: "Одна ключова метрика яка визначає успіх", ex: "Our north star metric for this account is profitable revenue, not just ROAS." },
  { id: 228, cat: "Collocations", lvl: "B2", en: "the elephant in the room", uk: "слон у кімнаті (очевидна проблема яку ніхто не озвучує)", ctx: "Перед тим як підняти незручну тему", ex: "Let's address the elephant in the room — the conversion tracking has been broken since March." },
  { id: 229, cat: "Collocations", lvl: "B2", en: "do the heavy lifting", uk: "виконувати основну роботу", ctx: "Про канал/процес що несе основне навантаження", ex: "Search is doing the heavy lifting — it's responsible for 70% of conversions." },
  { id: 230, cat: "Collocations", lvl: "B2", en: "a win-win", uk: "взаємовигідне рішення", ctx: "Ситуація вигідна обом сторонам", ex: "Switching to value-based bidding is a win-win — better margins for you, easier optimisation for us." },

  // ====== PHRASAL VERBS ======
  { id: 240, cat: "Phrasal verbs", lvl: "B1", en: "kick off (a campaign / a meeting / a project)", uk: "запустити / розпочати", ctx: "Найзагальніше дієслово для початку чогось", ex: "We're kicking off the Q3 campaign next Monday." },
  { id: 241, cat: "Phrasal verbs", lvl: "B1", en: "wrap up (a project / a call / a campaign)", uk: "завершити / закрити", ctx: "Протилежність kick off", ex: "Let's wrap up by 4pm — I have a hard stop." },
  { id: 242, cat: "Phrasal verbs", lvl: "B1+", en: "roll out (a feature / a campaign / a change)", uk: "розгорнути / запустити в production", ctx: "Поступово запустити щось нове", ex: "We're rolling out the new attribution model across all accounts next week." },
  { id: 243, cat: "Phrasal verbs", lvl: "B1+", en: "ramp up / ramp down (spend / activity)", uk: "поступово збільшити / зменшити", ctx: "Про поступову зміну темпу", ex: "Let's ramp up the budget by 10% each week to avoid spooking the algorithm." },
  { id: 244, cat: "Phrasal verbs", lvl: "B1+", en: "scale up / scale down / scale back", uk: "масштабувати / згорнути / відкотити назад", ctx: "Scale back = обережне зменшення", ex: "We need to scale back on Display until we figure out the attribution issue." },
  { id: 245, cat: "Phrasal verbs", lvl: "B1+", en: "drill down (into the data / into details)", uk: "заглибитися в деталі", ctx: "Перейти від загального до конкретного", ex: "Let's drill down into device-level performance — I think mobile is dragging the average." },
  { id: 246, cat: "Phrasal verbs", lvl: "B1+", en: "zoom in on / zoom out from", uk: "наблизитись до / віддалитись від", ctx: "Перенесене значення — фокусуватись або дивитись ширше", ex: "Let's zoom out from individual keywords and look at the campaign-level trend." },
  { id: 247, cat: "Phrasal verbs", lvl: "B1+", en: "loop someone in / loop someone out", uk: "включити в копію / прибрати з копії", ctx: "Про email/Slack обговорення", ex: "Looping in Sarah for visibility on the tracking issue." },
  { id: 248, cat: "Phrasal verbs", lvl: "B2", en: "follow up (on something) / follow through (on something)", uk: "повертатись з нагадуванням / доводити до кінця", ctx: "Follow up = check in; follow through = виконати обіцяне до кінця", ex: "I'll follow up on the budget question Friday. And I'll follow through on the new tracking setup by EOW." },
  { id: 249, cat: "Phrasal verbs", lvl: "B1+", en: "sign off on (something)", uk: "затвердити / підписати", ctx: "Про офіційне погодження", ex: "Once you sign off on the creative brief, we'll start production." },
  { id: 250, cat: "Phrasal verbs", lvl: "B1+", en: "push back on (something)", uk: "заперечити / не погодитись з", ctx: "Особливо в робочому контексті — стримане заперечення", ex: "I'd push back on the timeline — two weeks isn't realistic for this scope." },
  { id: 251, cat: "Phrasal verbs", lvl: "B2", en: "iron out (issues / details / kinks)", uk: "залагодити / 'розгладити' проблеми", ctx: "Залагодити дрібні проблеми перед запуском", ex: "We need a few more days to iron out the conversion tracking before we go live." },
  { id: 252, cat: "Phrasal verbs", lvl: "B1+", en: "sort out (something) / sort through (something)", uk: "розібратися / перебрати", ctx: "Sort out = вирішити; sort through = перебрати щоб знайти", ex: "Let me sort through the search term report and pull out the winners." },
  { id: 253, cat: "Phrasal verbs", lvl: "B2", en: "hash out (a plan / details)", uk: "обговорити і узгодити", ctx: "Жвава дискусія для досягнення згоди", ex: "Let's jump on a call Thursday and hash out the targeting strategy." },
  { id: 254, cat: "Phrasal verbs", lvl: "B2", en: "flesh out (an idea / a plan)", uk: "деталізувати / 'наповнити плоттю'", ctx: "Додати деталі і конкретику до сирої ідеї", ex: "I like the direction — can you flesh out the implementation plan a bit more?" },
  { id: 255, cat: "Phrasal verbs", lvl: "B1+", en: "walk (someone) through / run (someone) through", uk: "провести когось крок-за-кроком", ctx: "Пояснити деталі або процес комусь", ex: "Let me walk you through the audit findings — there are 3 main areas." },
  { id: 256, cat: "Phrasal verbs", lvl: "B1+", en: "set up / set up a meeting / set up a call", uk: "налаштувати / організувати зустріч", ctx: "Технічне 'set up' (систему) і соціальне (зустріч)", ex: "Let me set up a 30-min call so we can walk through the dashboard together." },
  { id: 257, cat: "Phrasal verbs", lvl: "B2", en: "pencil in (a meeting / a date)", uk: "попередньо записати в календар", ctx: "Тимчасово зарезервувати з можливістю скасування", ex: "Let's pencil in Wednesday at 2 — I'll confirm tomorrow." },
  { id: 258, cat: "Phrasal verbs", lvl: "B2", en: "block off (time / a slot)", uk: "заблокувати час", ctx: "Зарезервувати час у календарі без переносів", ex: "I've blocked off Friday afternoon for the deep dive — please don't schedule over." },
  { id: 259, cat: "Phrasal verbs", lvl: "B2", en: "carve out (time / budget for X)", uk: "виділити час / бюджет на щось", ctx: "Знайти і захистити ресурс для конкретної цілі", ex: "Let's carve out 15% of the test budget for YouTube experiments." },
  { id: 260, cat: "Phrasal verbs", lvl: "B2", en: "bring (something) up", uk: "підняти питання / згадати", ctx: "Згадати тему в розмові", ex: "Glad you brought that up — it's exactly what I wanted to discuss." },
  { id: 261, cat: "Phrasal verbs", lvl: "B2", en: "circle back (on something) / loop back", uk: "повернутися до питання пізніше", ctx: "Класичне 'corporate-speak' для відкладеного обговорення", ex: "Let's circle back on the creative direction once the data comes in." },
  { id: 262, cat: "Phrasal verbs", lvl: "B2", en: "pivot away from / pivot to", uk: "розвернутися / переорієнтуватись", ctx: "Кардинальна зміна напрямку стратегії", ex: "We're pivoting away from broad match keywords and leaning into exact match." },
  { id: 263, cat: "Phrasal verbs", lvl: "B2", en: "phase out (something)", uk: "поступово виводити з використання", ctx: "Не різко вимикати, а поступово зменшувати", ex: "We're phasing out manual bidding across all campaigns by end of quarter." },
  { id: 264, cat: "Phrasal verbs", lvl: "B2", en: "bottom out / level off", uk: "досягти дна / стабілізуватись", ctx: "Про показники: bottom out = найнижче; level off = вирівнялося", ex: "CPCs seem to have bottomed out at $1.40 — we're not seeing further drops." },
  { id: 265, cat: "Phrasal verbs", lvl: "B2", en: "tee (something) up", uk: "підготувати ґрунт / 'поставити м'яч на тi'", ctx: "З гольфу — підготувати щось для наступного кроку", ex: "I'll tee up the QBR deck so it's ready for your review by Friday." },
  { id: 266, cat: "Phrasal verbs", lvl: "B1+", en: "go over (something)", uk: "пройтися по / переглянути", ctx: "Спільно переглянути матеріал", ex: "Can we go over the recommendations together on Wednesday?" },
  { id: 267, cat: "Phrasal verbs", lvl: "B2", en: "go through / run through", uk: "пройти / прорепетирувати", ctx: "Перевірити крок за кроком", ex: "Let's go through the launch checklist before we hit publish." },
  { id: 268, cat: "Phrasal verbs", lvl: "B2", en: "fall through (a deal / a plan)", uk: "зірватися / не відбутися", ctx: "Про плани або угоди що не відбулись", ex: "The partnership fell through, so we need to rethink the channel mix for Q3." },
  { id: 269, cat: "Phrasal verbs", lvl: "B2", en: "back (someone / something) up", uk: "підтримати / підкріпити (даними)", ctx: "Підкріпити аргументами/доказами", ex: "I'll back up the recommendation with three case studies from similar accounts." },
  { id: 270, cat: "Phrasal verbs", lvl: "B1+", en: "lay out (a plan / a strategy)", uk: "викласти / розкласти по поличках", ctx: "Структурно представити план", ex: "I've laid out the next 90 days in the deck — let me know if anything's unclear." },
  { id: 271, cat: "Phrasal verbs", lvl: "B2", en: "pull (the data / a report) / pull together", uk: "витягнути дані / зібрати звіт", ctx: "Pull = витягнути з системи; pull together = зібрати докупи", ex: "Let me pull the data and put together a summary by EOD." },
  { id: 272, cat: "Phrasal verbs", lvl: "B1+", en: "come up with (an idea / a plan)", uk: "придумати / прийти до", ctx: "Креативно знайти рішення", ex: "Can you come up with three creative concepts by Thursday?" },
  { id: 273, cat: "Phrasal verbs", lvl: "B2", en: "lock in / lock down", uk: "зафіксувати / закріпити", ctx: "Зробити щось остаточним і незмінним", ex: "Once we lock in the budget, I'll restructure the campaigns accordingly." },
  { id: 274, cat: "Phrasal verbs", lvl: "B2", en: "sort out the kinks / iron out the wrinkles", uk: "залагодити нюанси / 'розгладити складки'", ctx: "Прибрати дрібні проблеми перед запуском", ex: "Give us another sprint to iron out the wrinkles in the tracking setup." },

  // ====== POWER PHRASES & ADVANCED ======
  { id: 290, cat: "Power phrases", lvl: "B2", en: "From a data perspective, / From a strategic standpoint,", uk: "З точки зору даних / стратегії,", ctx: "Потужний спосіб ввести експертну думку", ex: "From a data perspective, the dip is driven by weekend mobile traffic — not a real performance issue." },
  { id: 291, cat: "Power phrases", lvl: "B2", en: "What this tells us is…", uk: "Що це нам говорить —…", ctx: "Перейти від даних до інсайту", ex: "Conversions are up but AOV is down. What this tells us is we're attracting more bargain hunters." },
  { id: 292, cat: "Power phrases", lvl: "B2", en: "The hypothesis is that…", uk: "Гіпотеза в тому що…", ctx: "Дуже професійно — представити припущення яке тестуємо", ex: "The hypothesis is that broad match is bringing in unqualified traffic — this test will confirm it." },
  { id: 293, cat: "Power phrases", lvl: "B2", en: "Let's look at the underlying drivers.", uk: "Давай подивимось на глибинні фактори.", ctx: "Перейти від симптомів до причин", ex: "ROAS is down — but let's look at the underlying drivers before we react." },
  { id: 294, cat: "Power phrases", lvl: "B2", en: "I want to set us up for success.", uk: "Хочу налаштувати нас на успіх.", ctx: "Філософське — про підготовку проекту правильно", ex: "Before we launch, I want to make sure tracking is bulletproof — I want to set us up for success." },
  { id: 295, cat: "Power phrases", lvl: "B2", en: "Let's sanity-check this.", uk: "Давай перевіримо це на здоровий глузд.", ctx: "Швидка перевірка чи рішення взагалі логічне", ex: "Before we send the report, let's sanity-check the numbers — this conversion lift looks too good." },
  { id: 296, cat: "Power phrases", lvl: "B2", en: "We need to be intentional about this.", uk: "Маємо підходити до цього усвідомлено.", ctx: "Про обдумані рішення замість реактивних", ex: "We need to be intentional about budget allocation — not just react to weekly fluctuations." },
  { id: 297, cat: "Power phrases", lvl: "B2", en: "Let's not boil the ocean.", uk: "Давай не намагатись зробити все одразу.", ctx: "Класична corporate-ідіома — не братися за нереально великий обсяг роботи", ex: "Let's not boil the ocean — we'll start with the top 3 campaigns and expand from there." },
  { id: 298, cat: "Power phrases", lvl: "B2", en: "It's table stakes at this point.", uk: "Це базовий обов'язок зараз.", ctx: "Те що повинно бути зроблено мінімум", ex: "Conversion tracking accuracy is table stakes at this point — we can't optimise without it." },
  { id: 299, cat: "Power phrases", lvl: "B2", en: "We're flying blind without [data / tracking].", uk: "Ми летимо наосліп без [даних / трекінгу].", ctx: "Немає видимості в результати — ризиковано приймати рішення", ex: "We're flying blind without proper conversion tracking — fixing it is priority #1." },
  { id: 300, cat: "Power phrases", lvl: "B2", en: "Let's de-risk this approach.", uk: "Зменшимо ризик цього підходу.", ctx: "Зробити план менш ризикованим", ex: "Let's de-risk this approach — we'll start with 10% of budget instead of 50%." },
  { id: 301, cat: "Power phrases", lvl: "B2", en: "I want to keep us honest on…", uk: "Хочу щоб ми залишались чесними щодо…", ctx: "Запрошення до чесної самооцінки", ex: "I want to keep us honest on attribution — half of these conversions might be coming through organic anyway." },
  { id: 302, cat: "Power phrases", lvl: "B2", en: "There's signal in the noise.", uk: "В шумі є сигнал.", ctx: "Серед хаосу даних є важливий патерн", ex: "Look — week-to-week numbers are noisy, but there's signal in the noise: long-tail terms are converting 3x better." },
  { id: 303, cat: "Power phrases", lvl: "B2", en: "Let's let the data speak.", uk: "Дамо даним говорити самим за себе.", ctx: "Не прийняття рішень на емоціях", ex: "I have a hunch about this, but let's let the data speak — we'll have results by Friday." },
  { id: 304, cat: "Power phrases", lvl: "B2", en: "Let's not optimize for vanity metrics.", uk: "Давай не оптимізувати під 'марні' метрики.", ctx: "Vanity metrics = метрики які виглядають красиво але не приносять бізнес-результат", ex: "CTR is up but conversions are flat — let's not optimize for vanity metrics." },

  // ====== NEGOTIATION & SCOPE ======
  { id: 310, cat: "Negotiation", lvl: "B2", en: "That's outside the scope of this engagement.", uk: "Це поза рамками поточної угоди.", ctx: "Коли клієнт просить щось не зазначене в контракті", ex: "Building a CRM integration is outside the scope of this engagement — happy to scope a separate project." },
  { id: 311, cat: "Negotiation", lvl: "B1+", en: "Let's revisit the scope.", uk: "Давай переглянемо обсяг робіт.", ctx: "Коли треба розширити або звузити роботи", ex: "Given the new goals, let's revisit the scope before we kick off Q3." },
  { id: 312, cat: "Negotiation", lvl: "B2", en: "We can absolutely do that, but it would push the timeline.", uk: "Це можливо зробити, але це посуне терміни.", ctx: "Класичний trade-off — згода + наслідки", ex: "We can absolutely add YouTube, but it would push the launch to mid-July." },
  { id: 313, cat: "Negotiation", lvl: "B2", en: "Within budget / out of budget", uk: "В межах бюджету / поза бюджетом", ctx: "Базовий формальний термін", ex: "Phase 1 is well within budget. Phase 2 would be out of our current budget." },
  { id: 314, cat: "Negotiation", lvl: "B2", en: "We're at capacity right now.", uk: "Ми зараз завантажені на максимум.", ctx: "Не можемо взяти більше роботи", ex: "We're at capacity right now — earliest we could take this on is in 3 weeks." },
  { id: 315, cat: "Negotiation", lvl: "B2", en: "I want to set realistic expectations.", uk: "Хочу задати реалістичні очікування.", ctx: "Перед обговоренням обмежень", ex: "Before we proceed, I want to set realistic expectations on what's achievable in 4 weeks." },
  { id: 316, cat: "Negotiation", lvl: "B2", en: "What would you be willing to deprioritize?", uk: "Чим ти готовий пожертвувати в пріоритетах?", ctx: "Коли клієнт хоче все одразу", ex: "If we add the new product launch, what would you be willing to deprioritize from the existing roadmap?" },
  { id: 317, cat: "Negotiation", lvl: "B2", en: "There's a trade-off here.", uk: "Тут є компроміс.", ctx: "Перед поясненням двох взаємовиключних варіантів", ex: "There's a trade-off here: faster launch means less testing time." },
  { id: 318, cat: "Negotiation", lvl: "B1+", en: "We can prioritize speed or quality — not both.", uk: "Швидкість або якість — обираємо одне.", ctx: "Класичний triangle — fast/cheap/good — pick two", ex: "We can prioritize speed or quality — not both. Which matters more for this launch?" },
  { id: 319, cat: "Negotiation", lvl: "B2", en: "Scope creep", uk: "Розповзання скоупу — коли проект непомітно росте", ctx: "Стандартний термін у консалтингу", ex: "We need to watch out for scope creep — three small additions have already added a week to the timeline." },
  { id: 320, cat: "Negotiation", lvl: "B2", en: "If we add X, something else has to give.", uk: "Якщо додамо X, щось інше доведеться прибрати.", ctx: "Спокійне нагадування про обмеженість ресурсів", ex: "If we add the social campaign, something else has to give — either Display or the Q3 audit." },
  { id: 321, cat: "Negotiation", lvl: "B1+", en: "Let's renegotiate the terms.", uk: "Давай перепогодимо умови.", ctx: "Коли вихідні умови вже не підходять", ex: "Given the bigger budget, let's renegotiate the terms for the second half of the year." },
  { id: 322, cat: "Negotiation", lvl: "B2", en: "I can fast-track this for an additional fee.", uk: "Можу прискорити це за додаткову плату.", ctx: "Чесна пропозиція спідапу за гроші", ex: "Standard turnaround is 5 days. I can fast-track this for an additional fee — 24 hours." },
  { id: 323, cat: "Negotiation", lvl: "B2", en: "That's a hard no for me.", uk: "Це жорстке 'ні' з мого боку.", ctx: "Тверда дружня відмова", ex: "Cutting tracking budget is a hard no for me — we'd be flying blind." },
  { id: 324, cat: "Negotiation", lvl: "B2", en: "Let's meet in the middle.", uk: "Зустрінемось посередині.", ctx: "Запропонувати компроміс", ex: "You want 50%, I'd suggest 20% — let's meet in the middle at 30%." },
  { id: 325, cat: "Negotiation", lvl: "B2", en: "Let's find a middle ground.", uk: "Знайдімо компроміс.", ctx: "М'якше за 'meet in the middle'", ex: "I hear you on speed and I'm worried about quality — let's find a middle ground." },
  { id: 326, cat: "Negotiation", lvl: "B2", en: "What's a must-have vs a nice-to-have?", uk: "Що обов'язкове, а що 'було б добре'?", ctx: "Розділити пріоритети", ex: "Before we scope this out — what's a must-have vs a nice-to-have for the launch?" },
  { id: 327, cat: "Negotiation", lvl: "B2", en: "We're aligned on X, just not on Y.", uk: "Ми згодні щодо X, лише з Y не сходимось.", ctx: "Виділити точки згоди перед спірним пунктом", ex: "We're aligned on the strategy, just not on the timeline." },
  { id: 328, cat: "Negotiation", lvl: "B1+", en: "Let's lock in the scope before we proceed.", uk: "Давайте зафіксуємо скоуп перед тим, як рухатись далі.", ctx: "Запобігти scope creep на старті", ex: "Let's lock in the scope before we proceed — once we're 2 weeks in, changes will be expensive." },
  { id: 329, cat: "Negotiation", lvl: "B2", en: "What's the budget ceiling?", uk: "Який максимальний бюджет?", ctx: "Запитати про верхню межу", ex: "Before I scope this out — what's the budget ceiling we're working with?" },
  { id: 330, cat: "Negotiation", lvl: "B2", en: "I'd rather walk away than lower the standard.", uk: "Краще відмовлюсь, ніж знижуватиму стандарт.", ctx: "Жорстко — про принципи якості", ex: "If we can't track conversions properly, I'd rather walk away than lower the standard." },

  // ====== PROJECT MANAGEMENT ======
  { id: 350, cat: "Project mgmt", lvl: "B1+", en: "I'm blocked on X.", uk: "Заблокована через X.", ctx: "Не можу рухатись далі через залежність", ex: "I'm blocked on the Merchant Center access — can you nudge IT?" },
  { id: 351, cat: "Project mgmt", lvl: "B1+", en: "We're waiting on…", uk: "Чекаємо на… (щоб розблокуватись)", ctx: "Назвати конкретно що блокує", ex: "We're waiting on the dev team to push the new tracking pixel before we can launch." },
  { id: 352, cat: "Project mgmt", lvl: "B2", en: "What's the dependency?", uk: "Яка є залежність?", ctx: "З'ясувати що від чого залежить", ex: "Before I commit to a date — what's the dependency on the Salesforce side?" },
  { id: 353, cat: "Project mgmt", lvl: "B1+", en: "Let's unblock this.", uk: "Давай розблокуємо це.", ctx: "Активний підхід до проблеми", ex: "Let's unblock this today — I'll set up a quick call with all stakeholders." },
  { id: 354, cat: "Project mgmt", lvl: "B2", en: "It's on the critical path.", uk: "Це на критичному шляху проекту.", ctx: "Затримка цього блокує весь проект", ex: "Conversion tracking is on the critical path — everything downstream depends on it." },
  { id: 355, cat: "Project mgmt", lvl: "B1+", en: "Hand-off to [team / person]", uk: "Передача справ команді/людині", ctx: "Передача роботи між людьми", ex: "I'll do the hand-off to design once the brief is approved." },
  { id: 356, cat: "Project mgmt", lvl: "B1+", en: "Bring (someone) up to speed", uk: "Ввести (когось) в курс справ", ctx: "Швидко ввести нову людину в проект", ex: "Let me bring you up to speed on what we've tried so far." },
  { id: 357, cat: "Project mgmt", lvl: "B2", en: "Cross-functional team / cross-functional collaboration", uk: "Крос-функціональна команда / співпраця", ctx: "Команда з різних дисциплін (design, dev, marketing)", ex: "This needs cross-functional collaboration between marketing, dev, and product." },
  { id: 358, cat: "Project mgmt", lvl: "B2", en: "Stakeholders", uk: "Стейкхолдери — зацікавлені сторони", ctx: "Усі хто може впливати або зазнає впливу від проекту", ex: "Let's loop in all stakeholders before we make this call." },
  { id: 359, cat: "Project mgmt", lvl: "B1+", en: "I'll own that.", uk: "Я візьму це на себе.", ctx: "Взяти відповідальність за конкретну задачу", ex: "I'll own that — getting the brief done by Friday." },
  { id: 360, cat: "Project mgmt", lvl: "B1+", en: "Who owns this?", uk: "Хто за це відповідає?", ctx: "З'ясувати DRI", ex: "Quick check — who owns this on your team?" },
  { id: 361, cat: "Project mgmt", lvl: "B2", en: "DRI — Directly Responsible Individual", uk: "Безпосередньо відповідальна особа", ctx: "Apple-стиль — одна людина за кожну задачу", ex: "Every action item needs a DRI — otherwise things slip through." },
  { id: 362, cat: "Project mgmt", lvl: "B2", en: "RACI — Responsible / Accountable / Consulted / Informed", uk: "Матриця ролей у проекті", ctx: "Хто що робить, хто узгоджує, кого інформують", ex: "Before we start, let's draft a RACI for clarity on who decides what." },
  { id: 363, cat: "Project mgmt", lvl: "B1+", en: "We're behind schedule / on schedule / ahead of schedule", uk: "Відстаємо / за графіком / випереджаємо", ctx: "Стандартні фрази звітності", ex: "We're slightly behind schedule — three days behind, but recoverable." },
  { id: 364, cat: "Project mgmt", lvl: "B1+", en: "We're slipping on the deadline.", uk: "Зриваємо дедлайн.", ctx: "М'яко повідомити про затримку", ex: "Heads-up — we're slipping on the deadline by about a week." },
  { id: 365, cat: "Project mgmt", lvl: "B2", en: "We need to descope.", uk: "Треба зменшити обсяг робіт.", ctx: "Прибрати частину функціоналу щоб встигнути", ex: "Given the timeline, we need to descope the dashboard from v1 — adding it in v2." },
  { id: 366, cat: "Project mgmt", lvl: "B2", en: "Let's spike on this.", uk: "Давайте швидко дослідимо це.", ctx: "Швидке дослідження тех-питання перед оцінкою", ex: "Before we commit to feasibility, let's spike on this for a day." },
  { id: 367, cat: "Project mgmt", lvl: "B2", en: "Time-box this to X hours.", uk: "Обмеж це Х годинами.", ctx: "Жорстке обмеження часу на задачу", ex: "Time-box the research to 4 hours — if we don't have an answer by then, we make a call." },
  { id: 368, cat: "Project mgmt", lvl: "B2", en: "Build a buffer into the timeline.", uk: "Закласти буфер у термінах.", ctx: "Запас на непередбачуване", ex: "Let's build a 2-week buffer into the timeline — there will be surprises." },
  { id: 369, cat: "Project mgmt", lvl: "B2", en: "It's gated by [thing].", uk: "Це залежить від… (чекає на схвалення)", ctx: "Не можна рухатись поки [thing] не зроблено", ex: "Launch is gated by legal review — can't go live without it." },
  { id: 370, cat: "Project mgmt", lvl: "B1+", en: "Greenlight / red light it", uk: "Дати зелене світло / зупинити", ctx: "Схвалити або заблокувати ініціативу", ex: "We need someone senior to greenlight the budget increase." },
  { id: 371, cat: "Project mgmt", lvl: "B1+", en: "Sign-off (final approval)", uk: "Фінальна апрувка", ctx: "Офіційне погодження", ex: "I need your sign-off before we push to production." },
  { id: 372, cat: "Project mgmt", lvl: "B2", en: "Post-mortem (after the launch)", uk: "Розбір польотів після запуску", ctx: "Аналіз що пішло добре і погано", ex: "Let's schedule a post-mortem next Friday — both wins and lessons." },
  { id: 373, cat: "Project mgmt", lvl: "B2", en: "Pre-mortem (before the launch)", uk: "Передпрогноз — що може піти не так", ctx: "Прорахувати ризики до старту", ex: "Let's do a pre-mortem — imagine it failed, what would have caused it?" },
  { id: 374, cat: "Project mgmt", lvl: "B2", en: "Action items / next steps", uk: "Завдання / наступні кроки", ctx: "Стандартний кінець мітингу", ex: "Let me capture the action items before we wrap." },
  { id: 375, cat: "Project mgmt", lvl: "B2", en: "Single source of truth", uk: "Єдине джерело правди (документ/система)", ctx: "Один авторитетний документ де все актуальне", ex: "Notion is our single source of truth — everything else is just a copy." },
  { id: 376, cat: "Project mgmt", lvl: "B2", en: "Get on the same page", uk: "Бути на одній хвилі", ctx: "Узгодити розуміння", ex: "Let's get on the same page before the client call." },
  { id: 377, cat: "Project mgmt", lvl: "B2", en: "Run point on (something)", uk: "Бути головним по чомусь / координувати", ctx: "Лідирувати конкретну ініціативу", ex: "Sarah will run point on the new client onboarding." },
  { id: 378, cat: "Project mgmt", lvl: "B2", en: "Drive (a project / initiative)", uk: "Вести / просувати (проект)", ctx: "Активне керівництво з кінцевим результатом", ex: "I'll drive the migration to GA4 across all client accounts." },

  // ====== TRENDS & PATTERNS ======
  { id: 400, cat: "Trends & data", lvl: "B1+", en: "Numbers spiked / surged.", uk: "Цифри різко зросли.", ctx: "Різкий стрибок угору", ex: "Conversions spiked 40% on Friday — likely the email campaign." },
  { id: 401, cat: "Trends & data", lvl: "B1+", en: "Numbers cratered / tanked.", uk: "Цифри впали в яму.", ctx: "Різкий обвал униз", ex: "ROAS cratered last weekend — investigating now." },
  { id: 402, cat: "Trends & data", lvl: "B1+", en: "Steady growth / steady decline.", uk: "Стабільне зростання / зниження.", ctx: "Поступовий тренд", ex: "We've seen steady growth in branded searches — about 8% MoM." },
  { id: 403, cat: "Trends & data", lvl: "B1+", en: "Leveled off / plateaued.", uk: "Вирівнялось / вийшло на плато.", ctx: "Зростання зупинилось", ex: "CTR has plateaued at around 4.5% — time to test new headlines." },
  { id: 404, cat: "Trends & data", lvl: "B1+", en: "Bouncing back.", uk: "Відновлюється.", ctx: "Після просідання повернення", ex: "Performance is bouncing back after last week's tracking issue." },
  { id: 405, cat: "Trends & data", lvl: "B2", en: "Volatile / unstable.", uk: "Нестабільне / коливається.", ctx: "Великі коливання день до дня", ex: "Daily ROAS is volatile, but the 7-day average looks healthy." },
  { id: 406, cat: "Trends & data", lvl: "B1+", en: "Holding steady.", uk: "Тримається на рівні.", ctx: "Без особливих змін — стабільно", ex: "CPCs are holding steady around $1.40 — no surprises there." },
  { id: 407, cat: "Trends & data", lvl: "B1+", en: "QoQ / YoY / MoM / WoW", uk: "Скорочення для періодів порівняння", ctx: "Quarter / Year / Month / Week-over-week", ex: "Revenue is up 28% YoY but flat WoW." },
  { id: 408, cat: "Trends & data", lvl: "B2", en: "An outlier in the data", uk: "Викид у даних — окрема точка-аномалія", ctx: "Точка яка випадає з тренду", ex: "Tuesday is an outlier — a single big-ticket sale skewed the average." },
  { id: 409, cat: "Trends & data", lvl: "B2", en: "An anomaly worth investigating", uk: "Аномалія, варта дослідження", ctx: "Щось не вписується — треба зрозуміти чому", ex: "There's a spike on mobile only — that's an anomaly worth investigating." },
  { id: 410, cat: "Trends & data", lvl: "B2", en: "A statistical blip.", uk: "Статистичний шум — нічого серйозного", ctx: "Малозначущі коливання", ex: "I wouldn't read into Saturday's drop — looks like a statistical blip." },
  { id: 411, cat: "Trends & data", lvl: "B2", en: "Trending in the right / wrong direction.", uk: "Рухається в правильному / неправильному напрямку.", ctx: "Загальна оцінка тренду", ex: "Conversions are trending in the right direction — slowly, but consistently." },
  { id: 412, cat: "Trends & data", lvl: "B2", en: "On an upward / downward trajectory.", uk: "На висхідній / спадній траєкторії.", ctx: "Більш формально — про довгий тренд", ex: "We're on an upward trajectory across all key metrics for Q2." },
  { id: 413, cat: "Trends & data", lvl: "B2", en: "Hockey-stick growth.", uk: "Хокейна клюшка — різке зростання після плато", ctx: "Класична метафора SaaS-ринку", ex: "The new audience targeting drove hockey-stick growth in week 3." },
  { id: 414, cat: "Trends & data", lvl: "B2", en: "Drop-off in the funnel", uk: "Падіння у воронці на конкретному етапі", ctx: "Де користувачі покидають воронку", ex: "There's a major drop-off between add-to-cart and checkout — UX issue." },
  { id: 415, cat: "Trends & data", lvl: "B2", en: "There's a clear pattern emerging.", uk: "Чітко проявляється патерн.", ctx: "Видно повторюваність", ex: "Looking at the past 4 weeks, there's a clear pattern emerging — Tuesdays underperform." },
  { id: 416, cat: "Trends & data", lvl: "B2", en: "The data is inconclusive.", uk: "Дані не дають однозначної відповіді.", ctx: "Чесно — поки нічого ясного не видно", ex: "After two weeks the data is inconclusive — let's run another two." },
  { id: 417, cat: "Trends & data", lvl: "B2", en: "Statistically significant", uk: "Статистично значуще — не випадковість", ctx: "Стандартний термін A/B тестів", ex: "The lift is statistically significant at 95% confidence — we can call this a winner." },
  { id: 418, cat: "Trends & data", lvl: "B2", en: "Within the margin of error", uk: "У межах похибки — нічого не довести", ctx: "Різниця надто мала щоб робити висновки", ex: "Variant B is up 1.2% but it's within the margin of error." },
  { id: 419, cat: "Trends & data", lvl: "B2", en: "A meaningful lift / a marginal change", uk: "Суттєвий приріст / незначна зміна", ctx: "Оцінка масштабу зміни", ex: "We saw a meaningful lift on the new landing page — 18% conversion lift." },
  { id: 420, cat: "Trends & data", lvl: "B2", en: "Performance has tapered off.", uk: "Результати поступово зменшуються.", ctx: "Поступове згасання тренду", ex: "Performance has tapered off after the initial launch — time to refresh creative." },
  { id: 421, cat: "Trends & data", lvl: "B1+", en: "Numbers are noisy this week.", uk: "Цифри цього тижня хаотичні.", ctx: "Багато коливань без чіткого тренду", ex: "Numbers are noisy this week because of the holiday — let's wait before reacting." },
  { id: 422, cat: "Trends & data", lvl: "B2", en: "Filter out the noise / signal vs noise", uk: "Відфільтрувати шум / сигнал проти шуму", ctx: "Виділити важливе серед хаотичних даних", ex: "The trick is filtering out the noise to find the real signal." },
  { id: 423, cat: "Trends & data", lvl: "B2", en: "Cherry-pick the data", uk: "Вибірково подавати дані — негативно", ctx: "Показувати тільки зручні дані", ex: "Let's not cherry-pick the data — show the full month, not just the best week." },
  { id: 424, cat: "Trends & data", lvl: "B2", en: "Directional vs definitive insight", uk: "Орієнтовно проти однозначно — про дані", ctx: "Чи дані дають точну відповідь чи тільки натяк", ex: "These results are directional — to be definitive we'd need 4 more weeks." },
  { id: 425, cat: "Trends & data", lvl: "B2", en: "Leading indicator vs lagging indicator", uk: "Випереджаючий vs запізнілий індикатор", ctx: "Метрики що передбачають vs ті що відображають минуле", ex: "CTR is a leading indicator; revenue is lagging." },
  { id: 426, cat: "Trends & data", lvl: "B2", en: "Year-on-year (YoY) the numbers are up.", uk: "Рік до року цифри ростуть.", ctx: "Найважливіше порівняння для seasonality", ex: "YoY the numbers are up 35% — very strong quarter." },

  // ====== STRATEGY ======
  { id: 450, cat: "Strategy", lvl: "B2", en: "What's the strategic rationale?", uk: "Який стратегічний обґрунтування?", ctx: "Чому ми це робимо взагалі", ex: "Before we scale Display, what's the strategic rationale?" },
  { id: 451, cat: "Strategy", lvl: "B2", en: "Stay aligned with the bigger picture.", uk: "Тримайся в межах загальної картини.", ctx: "Не загубитись в тактичних деталях", ex: "Yes, this CPC is high, but stay aligned with the bigger picture — it's our highest-LTV channel." },
  { id: 452, cat: "Strategy", lvl: "B2", en: "Big-picture vs granular details", uk: "Великий план vs дрібниці", ctx: "Зум-аут vs зум-ін", ex: "Today let's focus on big-picture; we'll get into granular details next week." },
  { id: 453, cat: "Strategy", lvl: "B2", en: "Top-down vs bottom-up approach", uk: "Підхід зверху-вниз vs знизу-вверх", ctx: "Hierarchical vs grassroots планування", ex: "Top-down: leadership sets the goal. Bottom-up: we estimate from current performance." },
  { id: 454, cat: "Strategy", lvl: "B1+", en: "Phase 1 / Phase 2 / Phase 3", uk: "Фаза 1, 2, 3", ctx: "Розбити велику ініціативу на етапи", ex: "Phase 1 is hygiene work, Phase 2 is testing, Phase 3 is scale." },
  { id: 455, cat: "Strategy", lvl: "B2", en: "Roadmap for the next quarter", uk: "Дорожня карта на наступний квартал", ctx: "Високорівневий план", ex: "I'll share the Q3 roadmap by Friday — you'll see how all the pieces fit." },
  { id: 456, cat: "Strategy", lvl: "B2", en: "Crawl, walk, run approach", uk: "Підхід 'повзати, ходити, бігти' — поетапно", ctx: "Класична метафора поступового масштабування", ex: "Crawl, walk, run — let's start small, prove it works, then scale." },
  { id: 457, cat: "Strategy", lvl: "B2", en: "Test, learn, scale", uk: "Тестувати, вчитись, масштабувати", ctx: "Performance marketing мантра", ex: "Standard performance approach: test, learn, scale — and only what proves out." },
  { id: 458, cat: "Strategy", lvl: "B2", en: "MVP — minimum viable product / minimum viable test", uk: "Мінімальний життєздатний продукт/тест", ctx: "Найменша версія для перевірки гіпотези", ex: "Let's launch an MVP campaign — one ad group, one keyword theme — to validate before scaling." },
  { id: 459, cat: "Strategy", lvl: "B2", en: "Prove it out before scaling.", uk: "Спочатку довести, потім масштабувати.", ctx: "Не вкладати багато в недоведене", ex: "Two-week test first — let's prove it out before scaling." },
  { id: 460, cat: "Strategy", lvl: "B2", en: "Working backward from the goal", uk: "Йти від цілі назад", ctx: "Amazon-style методологія", ex: "Working backward from the goal: $500K Q3 revenue → 2,500 conversions → ~$200 CPA → $500K spend." },
  { id: 461, cat: "Strategy", lvl: "B2", en: "First principles thinking", uk: "Мислення з перших принципів — не від аналогій", ctx: "Ламати проблему до базових елементів", ex: "Let's apply first principles thinking — forget what worked before, what does the math actually say?" },
  { id: 462, cat: "Strategy", lvl: "B2", en: "Prioritization framework", uk: "Фреймворк пріоритезації", ctx: "Систематичний підхід до вибору задач", ex: "I use ICE as a prioritization framework — Impact, Confidence, Ease." },
  { id: 463, cat: "Strategy", lvl: "B2", en: "Impact / Effort matrix", uk: "Матриця Вплив / Зусилля", ctx: "2x2 для пріоритезації", ex: "Plotting these on an Impact/Effort matrix — quick wins are top-right." },
  { id: 464, cat: "Strategy", lvl: "B2", en: "Highest-leverage activity", uk: "Дія з максимальним важелем", ctx: "Малі зусилля → великий результат", ex: "The highest-leverage activity for this account is fixing the feed — everything else is downstream." },
  { id: 465, cat: "Strategy", lvl: "B2", en: "Quick wins vs strategic bets", uk: "Швидкі перемоги vs стратегічні ставки", ctx: "Tactical vs strategic роботи", ex: "We need a balance of quick wins and strategic bets — not just one." },
  { id: 466, cat: "Strategy", lvl: "B2", en: "What's our bet here?", uk: "Яку ставку ми тут робимо?", ctx: "На що саме ми ставимо в цьому плані", ex: "What's our bet here? That video creative beats static — let's design the test that way." },
  { id: 467, cat: "Strategy", lvl: "B2", en: "Hypothesis-driven approach", uk: "Підхід на основі гіпотез", ctx: "Кожна дія тестує конкретну гіпотезу", ex: "Hypothesis-driven approach — every campaign should be testing something specific." },
  { id: 468, cat: "Strategy", lvl: "B2", en: "Iterate quickly / iterate based on data", uk: "Швидко ітерувати / ітерувати на основі даних", ctx: "Постійні дрібні покращення", ex: "We iterate quickly — weekly tests, weekly optimisations." },
  { id: 469, cat: "Strategy", lvl: "B2", en: "Pivot when needed.", uk: "Робити поворот коли треба.", ctx: "Не триматись за неробочий план", ex: "We're 4 weeks in with no traction — time to pivot." },
  { id: 470, cat: "Strategy", lvl: "B2", en: "Sunset (an initiative / a campaign)", uk: "Закрити ініціативу / кампанію", ctx: "Поступово вивести з використання", ex: "Let's sunset the legacy Display campaigns — the new structure is outperforming." },
  { id: 471, cat: "Strategy", lvl: "B2", en: "Greenlight the project / kill the project", uk: "Дати зелене світло / закрити проект", ctx: "Бінарне рішення про долю ініціативи", ex: "Based on Q1 data, we should greenlight the rollout — strong ROI." },
  { id: 472, cat: "Strategy", lvl: "B2", en: "Double click on this.", uk: "Подвійне натискання — заглибитись в тему", ctx: "Стандартна корпоративна фраза", ex: "Let's double click on this — what specifically isn't working?" },

  // ====== CLIENT ONBOARDING ======
  { id: 490, cat: "Onboarding", lvl: "B1+", en: "Tell me a bit about your business.", uk: "Розкажи трохи про свій бізнес.", ctx: "Discovery question — для першого мітингу", ex: "Before we dive in, tell me a bit about your business — what does success look like?" },
  { id: 491, cat: "Onboarding", lvl: "B2", en: "What does success look like for you?", uk: "Як виглядає успіх для тебе?", ctx: "Зрозуміти власні KPI клієнта", ex: "What does success look like for you in 6 months? Revenue? Growth rate? Profitability?" },
  { id: 492, cat: "Onboarding", lvl: "B2", en: "What's your North Star metric?", uk: "Яка ваша головна метрика?", ctx: "Визначити одну ключову мету", ex: "Before we plan tactics — what's your North Star metric for this account?" },
  { id: 493, cat: "Onboarding", lvl: "B2", en: "Walk me through your customer journey.", uk: "Проведи мене по шляху клієнта.", ctx: "Зрозуміти воронку від першого кліку до покупки", ex: "Walk me through your customer journey — how do people typically discover and buy from you?" },
  { id: 494, cat: "Onboarding", lvl: "B2", en: "Who are your competitors?", uk: "Хто ваші конкуренти?", ctx: "Discovery — конкурентний аналіз", ex: "Who are your top three competitors, and what makes you different?" },
  { id: 495, cat: "Onboarding", lvl: "B2", en: "What's worked / hasn't worked in the past?", uk: "Що працювало / не працювало в минулому?", ctx: "Не повторювати чужих помилок", ex: "Quick context check — what's worked and what hasn't worked in the past on this account?" },
  { id: 496, cat: "Onboarding", lvl: "B1+", en: "What's the budget you're working with?", uk: "З яким бюджетом ми працюємо?", ctx: "Чесно і прямо про гроші", ex: "What's the budget you're working with — monthly or quarterly?" },
  { id: 497, cat: "Onboarding", lvl: "B2", en: "How will we measure success together?", uk: "Як ми будемо вимірювати успіх разом?", ctx: "Дефінити KPI на старті", ex: "Before we kick off — how will we measure success together? What metrics matter most?" },
  { id: 498, cat: "Onboarding", lvl: "B1+", en: "Let me set the agenda for today.", uk: "Дай мені окреслити порядок денний.", ctx: "Контролювати hosting мітингу", ex: "Let me set the agenda for today — 5 mins on intros, 20 on goals, 10 on next steps." },
  { id: 499, cat: "Onboarding", lvl: "B1+", en: "Here's how I typically work.", uk: "Ось як я зазвичай працюю.", ctx: "Описати свої процеси і ритм", ex: "Here's how I typically work — weekly check-ins, monthly reports, ad hoc Slack for urgent stuff." },
  { id: 500, cat: "Onboarding", lvl: "B2", en: "Let me give you a lay of the land.", uk: "Дай я введу тебе в курс справ.", ctx: "Описати поточний стан речей", ex: "Before we plan, let me give you a lay of the land on the account — three things you should know." },
  { id: 501, cat: "Onboarding", lvl: "B2", en: "What does your decision-making process look like?", uk: "Як виглядає ваш процес прийняття рішень?", ctx: "Хто і як апрувить", ex: "What does your decision-making process look like — who needs to sign off on budget changes?" },
  { id: 502, cat: "Onboarding", lvl: "B2", en: "I want to set us up for success from day one.", uk: "Хочу налаштувати нас на успіх з першого дня.", ctx: "Заклик до правильної підготовки", ex: "I want to set us up for success from day one — let's make sure tracking is bulletproof before we launch." },
  { id: 503, cat: "Onboarding", lvl: "B2", en: "How hands-on / hands-off do you want to be?", uk: "Наскільки активно ти хочеш бути залученим?", ctx: "Узгодити рівень взаємодії", ex: "Some clients want daily updates, others monthly — how hands-on/hands-off do you want to be?" },

  // ====== CREATIVE & COPY ======
  { id: 520, cat: "Creative", lvl: "B2", en: "What's the messaging hierarchy?", uk: "Яка ієрархія повідомлень?", ctx: "Що головне, що другорядне у комунікації", ex: "What's the messaging hierarchy — is price or quality the lead?" },
  { id: 521, cat: "Creative", lvl: "B2", en: "Tone of voice / brand voice", uk: "Тон комунікації / голос бренду", ctx: "Як бренд звучить — friendly, formal, playful", ex: "Let's stay consistent with your brand voice — playful but informative." },
  { id: 522, cat: "Creative", lvl: "B2", en: "It feels off-brand.", uk: "Це не пасує до бренду.", ctx: "Не відповідає brand guidelines", ex: "The new ad feels off-brand — too aggressive for your usual tone." },
  { id: 523, cat: "Creative", lvl: "B1+", en: "On-brand / off-brand", uk: "В стилі бренду / поза стилем", ctx: "Класичний creative-feedback", ex: "Variant A is more on-brand. Variant B is bolder but might alienate the core audience." },
  { id: 524, cat: "Creative", lvl: "B2", en: "Hook / headline / CTA / supporting copy", uk: "Зачепка / заголовок / заклик / основний текст", ctx: "Структура копірайту", ex: "The hook is strong but the CTA is weak — let's tighten 'Learn more' to 'Get a free quote'." },
  { id: 525, cat: "Creative", lvl: "B2", en: "It's not landing.", uk: "Це не 'заходить' / не резонує.", ctx: "Аудиторія не реагує", ex: "The first headline isn't landing — CTR is half what variant B is doing." },
  { id: 526, cat: "Creative", lvl: "B2", en: "Resonates with the target audience", uk: "Резонує з цільовою аудиторією", ctx: "Аудиторія відчуває емоційний зв'язок", ex: "The story angle resonates with the target audience — much higher engagement." },
  { id: 527, cat: "Creative", lvl: "B2", en: "Let's punch it up.", uk: "Давай зробимо це більш яскравим.", ctx: "Зробити сміливіше / емоційніше", ex: "The headline is too plain — let's punch it up with stronger verbs." },
  { id: 528, cat: "Creative", lvl: "B2", en: "Let's tone it down.", uk: "Давай знизимо тон.", ctx: "Зробити менш агресивно/гучно", ex: "The CTA feels pushy — let's tone it down a notch." },
  { id: 529, cat: "Creative", lvl: "B2", en: "Refresh the creative.", uk: "Оновити креатив.", ctx: "Оновити банери / тексти / відео", ex: "Performance is tapering — time to refresh the creative." },
  { id: 530, cat: "Creative", lvl: "B2", en: "Creative fatigue", uk: "Втома від креативу — аудиторія його перевиділа", ctx: "Коли той самий креатив виснажився", ex: "Frequency is over 8 — classic creative fatigue. We need new variants." },

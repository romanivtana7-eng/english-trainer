  { id: 531, cat: "Creative", lvl: "B2", en: "Let me give you my two cents on this.", uk: "Дай я скажу свою думку по цьому.", ctx: "Скромно ввести своє think", ex: "Let me give you my two cents — variant C feels generic, A and B are stronger." },
  { id: 532, cat: "Creative", lvl: "B2", en: "It hits the brief.", uk: "Це відповідає брифу.", ctx: "Виконує поставлені вимоги", ex: "Variant B hits the brief perfectly — clear value prop, strong CTA, on-brand." },
  { id: 533, cat: "Creative", lvl: "B2", en: "Iterate on the creative.", uk: "Доопрацювати креатив.", ctx: "Кілька раундів покращень", ex: "We'll iterate on the creative based on early performance signals." },
  { id: 534, cat: "Creative", lvl: "B2", en: "Make it pop.", uk: "Зробити щоб виділялось.", ctx: "Більш помітно / яскраво", ex: "The visual is fine, but make the CTA pop — it's getting lost." },

  // ====== CRISIS MANAGEMENT ======
  { id: 555, cat: "Crisis", lvl: "B2", en: "We've got a situation.", uk: "У нас тут проблема.", ctx: "Серйозне попередження клієнта", ex: "Hi Mark — we've got a situation. The Google Ads account just got suspended." },
  { id: 556, cat: "Crisis", lvl: "B1+", en: "We're treating this as priority one.", uk: "Це наш пріоритет номер один.", ctx: "Підкреслити терміновість", ex: "We're treating this as priority one — everyone's heads-down on the fix." },
  { id: 557, cat: "Crisis", lvl: "B2", en: "All hands on deck.", uk: "Всі сили на цьому.", ctx: "Уся команда мобілізована", ex: "Tracking pixel is broken — all hands on deck until it's fixed." },
  { id: 558, cat: "Crisis", lvl: "B2", en: "Containment first, then root cause.", uk: "Спочатку зупинити, потім розбиратись.", ctx: "Стандартний crisis response", ex: "Containment first, then root cause — let's pause spend before we investigate." },
  { id: 559, cat: "Crisis", lvl: "B2", en: "We've identified the root cause.", uk: "Ми визначили першопричину.", ctx: "Знайшли звідки проблема", ex: "Update — we've identified the root cause: a duplicate UTM tag." },
  { id: 560, cat: "Crisis", lvl: "B1+", en: "We've rolled back the change.", uk: "Ми відкотили зміни.", ctx: "Повернули до попередньої робочої версії", ex: "We've rolled back the change — performance should normalise within an hour." },
  { id: 561, cat: "Crisis", lvl: "B2", en: "Damage control mode.", uk: "Режим обмеження збитків.", ctx: "Мінімізувати наслідки кризи", ex: "We're in damage control mode — paused all paid spend until we know what's happening." },
  { id: 562, cat: "Crisis", lvl: "B2", en: "I'll keep you posted in real time.", uk: "Буду тримати в курсі в реальному часі.", ctx: "Постійні апдейти під час кризи", ex: "I'll keep you posted in real time — Slack me with any concerns as we work through this." },
  { id: 563, cat: "Crisis", lvl: "B2", en: "We're on top of it.", uk: "Ми тримаємо це під контролем.", ctx: "Заспокоїти клієнта", ex: "We're on top of it — fix should be live within the hour." },
  { id: 564, cat: "Crisis", lvl: "B2", en: "Worst case / best case scenario", uk: "Гірший / кращий сценарій", ctx: "Описати діапазон можливих наслідків", ex: "Worst case: we lose 3 days of spend. Best case: it's resolved in an hour." },
  { id: 565, cat: "Crisis", lvl: "B2", en: "We've got eyes on it.", uk: "Ми це моніторимо.", ctx: "Команда стежить за ситуацією", ex: "We've got eyes on it — alerts are set up if it spikes again." },
  { id: 566, cat: "Crisis", lvl: "B2", en: "Once the dust settles, let's debrief.", uk: "Коли пил осяде, проведемо розбір.", ctx: "Аналіз після завершення кризи", ex: "Once the dust settles, let's debrief and figure out how to prevent this." },
  { id: 567, cat: "Crisis", lvl: "B2", en: "Mitigate the impact", uk: "Зменшити вплив (на бізнес)", ctx: "Зробити так щоб збитки були меншими", ex: "We've paused spend to mitigate the impact while we troubleshoot." },
  { id: 568, cat: "Crisis", lvl: "B2", en: "Stand-by alert / heads-up", uk: "Попередження / готовність", ctx: "Попередити що щось може статись", ex: "Heads-up — Google's reviewing our account, might need your help if they request docs." },

  // ====== TIME & SCHEDULING ======
  { id: 580, cat: "Scheduling", lvl: "B1", en: "Does Tuesday work for you?", uk: "Вівторок підходить?", ctx: "Стандартне питання при пошуку часу", ex: "Does Tuesday at 2pm work for you?" },
  { id: 581, cat: "Scheduling", lvl: "B1+", en: "What's your availability this week?", uk: "Коли ти доступний цього тижня?", ctx: "Запитати про вільні слоти", ex: "What's your availability this week for a 30-min sync?" },
  { id: 582, cat: "Scheduling", lvl: "B1+", en: "I have a hard stop at 4pm.", uk: "У мене жорсткий стоп о 16:00.", ctx: "Не зможу затриматись після", ex: "Heads-up, I have a hard stop at 4 — let's prioritise the must-haves." },
  { id: 583, cat: "Scheduling", lvl: "B2", en: "Let's keep it to 30 minutes.", uk: "Тримаємось у 30 хвилин.", ctx: "Обмежити тривалість мітингу", ex: "Let's keep it to 30 minutes — I have back-to-backs after." },
  { id: 584, cat: "Scheduling", lvl: "B2", en: "I'm back-to-back today.", uk: "Сьогодні мітинги один за одним.", ctx: "Дуже завантажений день", ex: "I'm back-to-back today — Slack is faster than email." },
  { id: 585, cat: "Scheduling", lvl: "B2", en: "Let me check my calendar.", uk: "Дай я гляну свій календар.", ctx: "Перед погодженням часу", ex: "Let me check my calendar — I'll send three options by EOD." },
  { id: 586, cat: "Scheduling", lvl: "B1+", en: "I'll send a calendar invite.", uk: "Я надішлю календарне запрошення.", ctx: "Підтвердити мітинг через календар", ex: "Sounds good — I'll send a calendar invite for Thursday at 2." },
  { id: 587, cat: "Scheduling", lvl: "B1+", en: "Can we push this back?", uk: "Можемо перенести на пізніше?", ctx: "Запитати про відстрочення", ex: "Sorry, conflict came up — can we push this back to Friday?" },
  { id: 588, cat: "Scheduling", lvl: "B2", en: "Can we move this up?", uk: "Можемо перенести на раніше?", ctx: "На раніший час, не пізніший", ex: "If you have time today — can we move this up? I'd love to discuss before the Q3 plan goes out." },
  { id: 589, cat: "Scheduling", lvl: "B1+", en: "I'll need to reschedule.", uk: "Мені треба буде перенести.", ctx: "Скасувати + запропонувати інший час", ex: "Sorry, something urgent came up — I'll need to reschedule. Free Wednesday or Thursday?" },
  { id: 590, cat: "Scheduling", lvl: "B2", en: "Let's pencil it in for Wednesday.", uk: "Поставимо попередньо на середу.", ctx: "Тимчасово зарезервувати з можливістю змінити", ex: "Let's pencil it in for Wednesday — I'll confirm by Tuesday morning." },
  { id: 591, cat: "Scheduling", lvl: "B2", en: "I'm on PTO next week.", uk: "Я у відпустці наступного тижня.", ctx: "PTO = Paid Time Off — стандарт США", ex: "Heads-up, I'm on PTO next week — Sarah will cover anything urgent." },
  { id: 592, cat: "Scheduling", lvl: "B2", en: "OOO (out of office)", uk: "Поза офісом / недоступний", ctx: "Скорочення в email auto-replies", ex: "I'll be OOO Friday — please ping Sarah for anything time-sensitive." },
  { id: 593, cat: "Scheduling", lvl: "B2", en: "What time zone are you in?", uk: "В якому ти часовому поясі?", ctx: "Базове питання для глобальних команд", ex: "Quick check — what time zone are you in? I'm working from EST." },
  { id: 594, cat: "Scheduling", lvl: "B1+", en: "Mind your local time.", uk: "Зважай на свій місцевий час.", ctx: "Уточнення про часовий пояс", ex: "Sending the invite for 9am — mind your local time, I see you're in AEST." },
  { id: 595, cat: "Scheduling", lvl: "B2", en: "Let's find a time that works for both.", uk: "Знайдімо час що підходить обом.", ctx: "Узгодження часу між поясами", ex: "Tricky with the time zone gap — let's find a time that works for both." },
  { id: 596, cat: "Scheduling", lvl: "B1+", en: "I'll have to push this to next week.", uk: "Доведеться перенести на наступний тиждень.", ctx: "Не вистачить часу цього тижня", ex: "Three projects landed today — I'll have to push this to next week, sorry!" },
  { id: 597, cat: "Scheduling", lvl: "B2", en: "Block 30 minutes on my calendar.", uk: "Заблокуй 30 хв у моєму календарі.", ctx: "Зарезервувати слот", ex: "I'll block 30 minutes on my calendar Friday for the deep dive." },

  // ====== CONFIRMATIONS / QUICK ACKNOWLEDGMENTS ======
  { id: 605, cat: "Confirmations", lvl: "B1", en: "Got it.", uk: "Зрозуміла.", ctx: "Найкоротше підтвердження", ex: "Got it — adding the negative now." },
  { id: 606, cat: "Confirmations", lvl: "B1", en: "Will do.", uk: "Зроблю.", ctx: "Підтвердження дії", ex: "Will do — sending the report by EOD." },
  { id: 607, cat: "Confirmations", lvl: "B1", en: "On it.", uk: "Вже працюю над цим.", ctx: "Активне підтвердження — у процесі", ex: "On it — give me 15 minutes." },
  { id: 608, cat: "Confirmations", lvl: "B1", en: "Sounds good.", uk: "Звучить добре.", ctx: "Згода з пропозицією", ex: "Sounds good — let's do Wednesday at 2." },
  { id: 609, cat: "Confirmations", lvl: "B1", en: "Makes sense.", uk: "Логічно.", ctx: "Підтвердити що зрозуміла і згодна", ex: "Makes sense — let's go with that approach." },
  { id: 610, cat: "Confirmations", lvl: "B1+", en: "Roger that. / 10-4.", uk: "Прийнято. / Ок.", ctx: "Військовий стиль — для casual чатів", ex: "Roger that — pulling the data now." },
  { id: 611, cat: "Confirmations", lvl: "B1+", en: "Copy that.", uk: "Прийнято. / Зрозумів.", ctx: "Більш професійно ніж 'roger that'", ex: "Copy that — will update the campaign accordingly." },
  { id: 612, cat: "Confirmations", lvl: "B1+", en: "Acknowledged.", uk: "Підтверджено.", ctx: "Дуже формально", ex: "Acknowledged — I'll wait for your sign-off before launching." },
  { id: 613, cat: "Confirmations", lvl: "B1", en: "Crystal clear.", uk: "Кришталево чисто. / Зрозуміло.", ctx: "Підтвердити повне розуміння", ex: "Crystal clear — running point on this myself." },
  { id: 614, cat: "Confirmations", lvl: "B1+", en: "Loud and clear.", uk: "Чітко і ясно.", ctx: "Альтернатива 'crystal clear'", ex: "Loud and clear — pausing the campaigns now." },
  { id: 615, cat: "Confirmations", lvl: "B2", en: "Consider it done.", uk: "Вважай вже зробленим.", ctx: "Сильне зобов'язання", ex: "Consider it done — sending the report tonight." },
  { id: 616, cat: "Confirmations", lvl: "B1", en: "Noted.", uk: "Прийняла до уваги.", ctx: "Базове ділове підтвердження", ex: "Noted — will adjust the strategy accordingly." },
  { id: 617, cat: "Confirmations", lvl: "B2", en: "Understood, leaving it with you.", uk: "Зрозуміла, передаю тобі.", ctx: "Завершити thread — передати ініціативу", ex: "Understood, leaving it with you — let me know once you've decided." },
  { id: 618, cat: "Confirmations", lvl: "B1+", en: "All good on my end.", uk: "З мого боку все добре.", ctx: "Підтвердити що твоя частина готова", ex: "All good on my end — waiting on dev to push the change." },

  // ====== TECH & TOOLS TALK ======
  { id: 625, cat: "Tech talk", lvl: "B2", en: "Tracking is broken / firing / not firing.", uk: "Трекінг не працює / спрацьовує / не спрацьовує", ctx: "Стандартний marketing-tech словник", ex: "Tracking pixel isn't firing on the thank-you page — investigating." },
  { id: 626, cat: "Tech talk", lvl: "B2", en: "Push the change to production.", uk: "Залити зміни в production.", ctx: "Виносити в живе середовище", ex: "Once QA signs off, we'll push the change to production." },
  { id: 627, cat: "Tech talk", lvl: "B2", en: "Roll back to the previous version.", uk: "Відкотити до попередньої версії.", ctx: "Coли нова версія зламала щось", ex: "Let's roll back to the previous version — too many issues with the new tag." },
  { id: 628, cat: "Tech talk", lvl: "B2", en: "Stage / staging environment", uk: "Тестове середовище — перед prod", ctx: "Тестова версія сайту/системи", ex: "I'll set up the test on staging first before we touch the live site." },
  { id: 629, cat: "Tech talk", lvl: "B2", en: "Plug-and-play / out-of-the-box", uk: "Готове рішення — встав і працює", ctx: "Просте встановлення без налаштувань", ex: "GA4 isn't quite plug-and-play — it needs configuration to work properly." },
  { id: 630, cat: "Tech talk", lvl: "B2", en: "Workaround", uk: "Обхідне рішення", ctx: "Не ідеальний фікс, але працює", ex: "There's no clean fix yet — but I have a workaround that gets us 90% of the way." },
  { id: 631, cat: "Tech talk", lvl: "B2", en: "Edge case", uk: "Крайній випадок", ctx: "Рідкісна ситуація що ламає систему", ex: "It works in 95% of cases — but there's an edge case with safari mobile we need to handle." },
  { id: 632, cat: "Tech talk", lvl: "B1+", en: "Spin up (a campaign / a project / an environment)", uk: "Запустити / розгорнути швидко", ctx: "Швидко налаштувати щось нове", ex: "Let me spin up a test campaign by Friday — small budget, fast learnings." },
  { id: 633, cat: "Tech talk", lvl: "B2", en: "API integration / API call", uk: "Інтеграція через API / запит до API", ctx: "Стандартна tech vocab", ex: "We'll need an API integration with your CRM to pull conversion data automatically." },
  { id: 634, cat: "Tech talk", lvl: "B2", en: "Bandwidth (capacity)", uk: "Bandwidth — тут: пропускна здатність / час", ctx: "Чи є час/ресурси на щось", ex: "Do you have bandwidth this week to review the creative brief?" },
  { id: 635, cat: "Tech talk", lvl: "B2", en: "Future-proof (this approach)", uk: "Зробити стійким до майбутнього", ctx: "Спроектувати щоб не довелось переробляти", ex: "Let's future-proof the tracking setup — switch to GA4 now before we're forced to." },
  { id: 636, cat: "Tech talk", lvl: "B2", en: "Source of truth (system of record)", uk: "Джерело правди — авторитетна система", ctx: "Яка система є основною для даних", ex: "Salesforce is your source of truth for revenue — let's reconcile our reports against it." },
  { id: 637, cat: "Tech talk", lvl: "B2", en: "Permissions / access controls", uk: "Дозволи / контроль доступу", ctx: "Хто що може бачити/міняти", ex: "I don't have edit access to the property — can you adjust permissions?" },
  { id: 638, cat: "Tech talk", lvl: "B2", en: "Bug / glitch / hiccup", uk: "Баг / збій / тимчасова проблема", ctx: "Bug = повторюваний; glitch = дрібний; hiccup = разовий", ex: "Just a hiccup with the API yesterday — back to normal now." },
  { id: 639, cat: "Tech talk", lvl: "B2", en: "Latency", uk: "Затримка — у відповіді системи / даних", ctx: "Time delay для tech systems", ex: "There's some latency between Google Ads and BigQuery — data is usually 4 hours behind." },

  // ====== DIFFICULT CONVERSATIONS ======
  { id: 660, cat: "Difficult talks", lvl: "B2", en: "I want to be candid with you.", uk: "Хочу бути відверта з тобою.", ctx: "Перед чесним складним повідомленням", ex: "I want to be candid with you — at this rate, we won't hit the Q3 target." },
  { id: 661, cat: "Difficult talks", lvl: "B2", en: "Let me be direct.", uk: "Дай я скажу прямо.", ctx: "Без 'обгорток' — прямо до суті", ex: "Let me be direct — the current strategy isn't working." },
  { id: 662, cat: "Difficult talks", lvl: "B2", en: "I'm going to push back on that.", uk: "Я з цим не погоджуся.", ctx: "Підготовка до незгоди", ex: "I'm going to push back on that — we don't have data to support that decision." },
  { id: 663, cat: "Difficult talks", lvl: "B2", en: "I have to flag a concern.", uk: "Мушу попередити про побоювання.", ctx: "Формально звернути увагу на проблему", ex: "I have to flag a concern — moving budget that fast usually backfires." },
  { id: 664, cat: "Difficult talks", lvl: "B2", en: "This isn't sustainable.", uk: "Це не може довго так тривати.", ctx: "Поточний стан небезпечний у довгу", ex: "Burning through budget at this CPA isn't sustainable — we need to recalibrate." },
  { id: 665, cat: "Difficult talks", lvl: "B2", en: "I want to be transparent with you.", uk: "Хочу бути прозорою з тобою.", ctx: "Чесний апдейт навіть якщо неприємно", ex: "I want to be transparent with you — we likely won't hit our Q1 numbers." },
  { id: 666, cat: "Difficult talks", lvl: "B2", en: "Let's address the elephant in the room.", uk: "Давай поговоримо про слона у кімнаті.", ctx: "Підняти незручну тему якої уникали", ex: "Before we keep planning — let's address the elephant in the room: the tracking issue." },
  { id: 667, cat: "Difficult talks", lvl: "B2", en: "I don't want to sugarcoat this.", uk: "Не хочу прикрашати це.", ctx: "Готовність сказати неприємну правду", ex: "I don't want to sugarcoat this — performance is below where it should be." },
  { id: 668, cat: "Difficult talks", lvl: "B2", en: "We need to have a tough conversation.", uk: "Маємо провести важку розмову.", ctx: "Сигнал що тема серйозна", ex: "Hi Mark, can we hop on a call? We need to have a tough conversation about the contract." },
  { id: 669, cat: "Difficult talks", lvl: "B2", en: "I owe it to you to be honest about…", uk: "Я зобов'язана бути чесною про…", ctx: "Підкреслити моральне зобов'язання", ex: "I owe it to you to be honest about what's realistic in this timeframe." },
  { id: 670, cat: "Difficult talks", lvl: "B2", en: "Saying no is the right call here.", uk: "Сказати 'ні' — правильне рішення.", ctx: "Обґрунтувати відмову", ex: "I know it's tempting, but saying no is the right call here — the data isn't there yet." },
  { id: 671, cat: "Difficult talks", lvl: "B2", en: "I have to draw the line at…", uk: "Я повинна провести межу на…", ctx: "Чітка межа — далі не йду", ex: "I have to draw the line at running ads without proper disclaimers — that's a legal risk." },
  { id: 672, cat: "Difficult talks", lvl: "B2", en: "Let's have an honest conversation about expectations.", uk: "Давай чесно поговоримо про очікування.", ctx: "Перепогодити що реалістично", ex: "Let's have an honest conversation about expectations — given current spend, 5x ROAS isn't realistic." },
  { id: 673, cat: "Difficult talks", lvl: "B2", en: "I want to address something directly.", uk: "Хочу зачепити дещо прямо.", ctx: "Перед серйозною темою", ex: "Before we get into the agenda — I want to address something directly about last week's miss." },

  // ====== ACCOUNT GROWTH / RETENTION ======
  { id: 690, cat: "Growth & retention", lvl: "B2", en: "Quarterly business review (QBR)", uk: "Квартальний бізнес-огляд", ctx: "Стандартна B2B практика", ex: "Let's set up a QBR for early July to review Q2 and plan Q3." },
  { id: 691, cat: "Growth & retention", lvl: "B2", en: "Show value / demonstrate impact", uk: "Показати цінність / довести вплив", ctx: "Підтвердити що інвестиція виправдана", ex: "The QBR is your chance to show value — focus on revenue impact, not vanity metrics." },
  { id: 692, cat: "Growth & retention", lvl: "B2", en: "Renewal conversation", uk: "Розмова про продовження", ctx: "Перед закінченням контракту", ex: "Renewal conversation is in 6 weeks — let's make sure the data tells a strong story." },
  { id: 693, cat: "Growth & retention", lvl: "B2", en: "Upsell / cross-sell", uk: "Допродаж дорожчого / суміжного продукту", ctx: "Продаж клієнту більше", ex: "Now that Search is dialed in, there's a natural upsell opportunity — YouTube." },
  { id: 694, cat: "Growth & retention", lvl: "B2", en: "Land and expand", uk: "Зайти і розширюватись", ctx: "Стратегія: маленький контракт → великий", ex: "We landed on Search — now let's expand into Display and YouTube." },
  { id: 695, cat: "Growth & retention", lvl: "B2", en: "Build a strong case for…", uk: "Збудувати сильну аргументацію для…", ctx: "Готувати презентацію з фактами", ex: "Let's build a strong case for the budget increase — three case studies, two charts, one ask." },
  { id: 696, cat: "Growth & retention", lvl: "B2", en: "Make the business case for X", uk: "Зробити бізнес-кейс для X", ctx: "Обґрунтувати цифрами", ex: "I'll make the business case for adding YouTube — projected ROI and risk analysis." },
  { id: 697, cat: "Growth & retention", lvl: "B2", en: "Customer lifetime value (LTV)", uk: "Цінність клієнта за весь час", ctx: "Скільки приносить клієнт за роки", ex: "We need to think LTV, not just first purchase — that changes our acceptable CPA." },
  { id: 698, cat: "Growth & retention", lvl: "B2", en: "Retention is cheaper than acquisition.", uk: "Утримання дешевше ніж залучення.", ctx: "Класична маркетингова мудрість", ex: "Retention is cheaper than acquisition — let's make sure we're nurturing existing customers." },
  { id: 699, cat: "Growth & retention", lvl: "B2", en: "Churn risk", uk: "Ризик відтоку (клієнтів)", ctx: "Хто може піти", ex: "I'm seeing churn risk signals — engagement is dropping for the past 3 months." },
  { id: 700, cat: "Growth & retention", lvl: "B2", en: "Stickiness (of a product / a relationship)", uk: "Прив'язаність / стійкість стосунків", ctx: "Як міцно клієнт прив'язаний", ex: "The integration improves stickiness — once it's set up, switching is painful." },
  { id: 701, cat: "Growth & retention", lvl: "B2", en: "Strategic partner vs vendor", uk: "Стратегічний партнер vs постачальник", ctx: "Тип стосунків — глибший vs поверхневий", ex: "We want to be a strategic partner, not just a vendor — that's why we're proactive on insights." },

  // ====== COMPETITOR & MARKET TALK ======
  { id: 720, cat: "Competitors", lvl: "B2", en: "Auction insights", uk: "Аналіз аукціону (Google Ads звіт)", ctx: "Хто з ким конкурує в Google Ads", ex: "Looking at auction insights, Competitor X is showing 60% overlap with us." },
  { id: 721, cat: "Competitors", lvl: "B2", en: "Competitive landscape", uk: "Конкурентна картина", ctx: "Загальний огляд ринку", ex: "Let me give you a snapshot of the competitive landscape before we plan messaging." },
  { id: 722, cat: "Competitors", lvl: "B2", en: "Outranked by competitor X", uk: "Конкурент X випереджає нас в ранжуванні", ctx: "Класична метрика SEO/Search Ads", ex: "We're getting outranked by Competitor X on the top 5 commercial keywords." },
  { id: 723, cat: "Competitors", lvl: "B2", en: "Top-of-funnel (TOFU) / Mid-funnel (MOFU) / Bottom-of-funnel (BOFU)", uk: "Верх / середина / низ воронки", ctx: "Стандартна marketer термінологія", ex: "We're strong on BOFU but weak on TOFU — that's why volume is capped." },
  { id: 724, cat: "Competitors", lvl: "B2", en: "Share of voice (SOV)", uk: "Частка голосу — % від загальних показів", ctx: "Скільки нас бачать порівняно з ринком", ex: "Our SOV is 18% in the category — leader is at 32%." },
  { id: 725, cat: "Competitors", lvl: "B2", en: "Differentiate from competitors / stand out", uk: "Відрізнятись від конкурентів / виділятись", ctx: "Бути іншим — і помітним", ex: "We need to differentiate from competitors with a clearer value prop." },
  { id: 726, cat: "Competitors", lvl: "B2", en: "Race to the bottom (on price)", uk: "Гонка на дно — змагання у зниженні цін", ctx: "Шкідлива конкуренція тільки за ціною", ex: "Let's avoid a race to the bottom on price — compete on value instead." },
  { id: 727, cat: "Competitors", lvl: "B2", en: "Category leader / category creator", uk: "Лідер категорії / творець категорії", ctx: "Хто домінує / хто створив нішу", ex: "We're the category creator — competitors are following our playbook." },
  { id: 728, cat: "Competitors", lvl: "B2", en: "Market share", uk: "Частка ринку", ctx: "Базовий бізнес термін", ex: "Our market share grew from 12% to 17% YoY." },

  // ====== AUDIENCE / TARGETING ======
  { id: 740, cat: "Audience", lvl: "B2", en: "Target audience / target persona", uk: "Цільова аудиторія / персона", ctx: "Кому ми робимо рекламу", ex: "Let's nail down the target persona before we write copy." },
  { id: 741, cat: "Audience", lvl: "B2", en: "Buyer persona / ideal customer profile (ICP)", uk: "Персона покупця / ідеальний клієнт", ctx: "Дуже детальний портрет аудиторії", ex: "Our ICP is mid-market SaaS — 50–500 employees, $5–50M ARR." },
  { id: 742, cat: "Audience", lvl: "B2", en: "Lookalike audience (LAL)", uk: "Lookalike — аудиторія схожа на клієнтів", ctx: "Facebook/Google feature", ex: "Let's build a 1% lookalike from our top 10% LTV customers." },
  { id: 743, cat: "Audience", lvl: "B2", en: "Audience overlap / cannibalisation", uk: "Перекриття аудиторій / канібалізація", ctx: "Дві кампанії конкурують за тих самих", ex: "There's heavy audience overlap between Display and Discovery — we're paying twice." },
  { id: 744, cat: "Audience", lvl: "B2", en: "Segment / segmentation", uk: "Сегмент / сегментація", ctx: "Розділити аудиторію за критеріями", ex: "Segmentation by intent — high vs low — lets us spend differently." },
  { id: 745, cat: "Audience", lvl: "B2", en: "Hot / warm / cold audience", uk: "Гаряча / тепла / холодна аудиторія", ctx: "За готовністю до покупки", ex: "Cold audiences need awareness creative — hot audiences need direct CTAs." },
  { id: 746, cat: "Audience", lvl: "B2", en: "Retargeting / remarketing", uk: "Ретаргетинг — реклама на тих, хто вже взаємодіяв", ctx: "Базова PPC техніка", ex: "Retargeting cart abandoners is 4x more efficient than cold prospecting." },
  { id: 747, cat: "Audience", lvl: "B2", en: "First-party data / third-party data", uk: "Дані 1-ї сторони / 3-ї сторони", ctx: "Свої дані vs куплені у брокерів", ex: "Post-cookie world is all about first-party data — let's prioritize email list growth." },
  { id: 748, cat: "Audience", lvl: "B2", en: "Suppression list / exclusion list", uk: "Список виключень — кому НЕ показувати", ctx: "Прибрати поточних клієнтів від реклами", ex: "Add existing customers to the suppression list so we don't waste budget on them." },
  { id: 749, cat: "Audience", lvl: "B2", en: "High-intent / low-intent traffic", uk: "Високої / низької наміру трафік", ctx: "Готовність купити", ex: "High-intent keywords convert at 8%; low-intent at 1.5% — different bidding strategies." },

  // ====== TESTING LANGUAGE ======
  { id: 760, cat: "Testing", lvl: "B1+", en: "A/B test / split test", uk: "A/B тест", ctx: "Базовий experimental setup", ex: "We'll A/B test three headlines for two weeks." },
  { id: 761, cat: "Testing", lvl: "B2", en: "Control vs variant / variant A / variant B", uk: "Контроль vs варіант / варіант A / B", ctx: "Структура експерименту", ex: "Variant B beat the control by 18% — let's promote it." },
  { id: 762, cat: "Testing", lvl: "B2", en: "Statistical significance / 95% confidence", uk: "Статистична значущість / 95% довіра", ctx: "Чи результат не випадковий", ex: "We need at least 95% confidence before declaring a winner." },
  { id: 763, cat: "Testing", lvl: "B2", en: "Sample size / sample size calculator", uk: "Розмір вибірки / калькулятор", ctx: "Скільки даних треба для висновку", ex: "Run the sample size calculator first — otherwise we're testing on noise." },
  { id: 764, cat: "Testing", lvl: "B2", en: "Holdout group", uk: "Контрольна група без впливу", ctx: "Не показувати рекламу — для incrementality", ex: "We'll keep a 10% holdout group to measure true incrementality." },
  { id: 765, cat: "Testing", lvl: "B2", en: "Incrementality testing", uk: "Тест на додатковість", ctx: "Чи реклама дала додаткові продажі", ex: "Brand campaigns need incrementality testing — we suspect a lot would have converted anyway." },
  { id: 766, cat: "Testing", lvl: "B2", en: "Test cycle / iteration cycle", uk: "Цикл тестування / ітерацій", ctx: "Регулярний ритм експериментів", ex: "We're on a 2-week test cycle — Monday launch, Friday review." },
  { id: 767, cat: "Testing", lvl: "B2", en: "Confounding variables", uk: "Сторонні змінні що ламають експеримент", ctx: "Не контрольовані фактори", ex: "Tough to isolate the impact — there are too many confounding variables this month." },
  { id: 768, cat: "Testing", lvl: "B2", en: "Read out results / readout", uk: "Звіт / винесення результатів", ctx: "Презентація результатів тесту", ex: "We'll read out results next Friday — clean recap of what worked." },
  { id: 769, cat: "Testing", lvl: "B2", en: "Run a pilot / pilot test", uk: "Провести пілот / пілотний тест", ctx: "Маленький тест перед повним розгортанням", ex: "Let's run a pilot in two markets first — then expand if it proves out." },
  { id: 770, cat: "Testing", lvl: "B2", en: "Promote the winner / kill the loser", uk: "Розгорнути переможця / закрити невдаху", ctx: "Стандартний flow після тесту", ex: "Pretty clear test — let's promote the winner and kill the loser by end of week." },

  // ====== MORE PHRASAL VERBS ======
  { id: 780, cat: "Phrasal verbs", lvl: "B2", en: "act on (information / feedback)", uk: "діяти на основі інфи / фідбеку", ctx: "Не тільки отримати, а й зреагувати", ex: "Thanks for the feedback — I'll act on it this week." },
  { id: 781, cat: "Phrasal verbs", lvl: "B2", en: "bank on (something)", uk: "розраховувати на щось", ctx: "Сильна впевненість у результаті", ex: "Don't bank on PMax delivering before week 3 — it always needs ramp time." },
  { id: 782, cat: "Phrasal verbs", lvl: "B2", en: "bear out (a hypothesis)", uk: "підтвердити (гіпотезу)", ctx: "Дані підтверджують припущення", ex: "The data bears out our hypothesis that mobile is the bottleneck." },
  { id: 783, cat: "Phrasal verbs", lvl: "B2", en: "branch out into (a new channel)", uk: "розширюватись у новий напрямок", ctx: "Виходити в нову сферу", ex: "We're ready to branch out into TikTok — Display is saturated." },
  { id: 784, cat: "Phrasal verbs", lvl: "B2", en: "break down (analyze in parts)", uk: "розкласти / проаналізувати по частинах", ctx: "Деталізувати щось", ex: "Let me break down the spend by channel so we can see where the leakage is." },
  { id: 785, cat: "Phrasal verbs", lvl: "B2", en: "bring (something) to the table", uk: "запропонувати / привнести", ctx: "Що ти даєш у партнерство", ex: "What does each agency bring to the table? That's what we should compare." },
  { id: 786, cat: "Phrasal verbs", lvl: "B1+", en: "catch up (on something)", uk: "наздогнати по якомусь питанню", ctx: "Відновити контекст після паузи", ex: "Let me catch up on the Slack thread before our call." },
  { id: 787, cat: "Phrasal verbs", lvl: "B2", en: "clear up (a misunderstanding)", uk: "прояснити непорозуміння", ctx: "Виправити сплутаний контекст", ex: "Let me clear up the confusion — we're not pausing Search, just restructuring it." },
  { id: 788, cat: "Phrasal verbs", lvl: "B2", en: "come down to (something)", uk: "зводитись до чогось", ctx: "У підсумку справа в…", ex: "It comes down to one thing: we don't have enough first-party data." },
  { id: 789, cat: "Phrasal verbs", lvl: "B2", en: "dial in (a process / a campaign)", uk: "налаштувати / 'довести до досконалості'", ctx: "Виправити дрібниці щоб працювало як годинник", ex: "Once we dial in the bidding strategy, performance should stabilise." },
  { id: 790, cat: "Phrasal verbs", lvl: "B2", en: "drum up (interest / demand)", uk: "розбурхати інтерес / попит", ctx: "Активно генерувати увагу", ex: "We need to drum up interest before launch — let's seed content 2 weeks early." },
  { id: 791, cat: "Phrasal verbs", lvl: "B2", en: "factor in (variables)", uk: "врахувати (фактори)", ctx: "Включити в розрахунок", ex: "Factor in seasonality before drawing conclusions from this week's data." },
  { id: 792, cat: "Phrasal verbs", lvl: "B2", en: "follow through (on a promise)", uk: "довести до кінця (обіцяне)", ctx: "Не просто пообіцяти — виконати", ex: "I'll follow through on the audit by Friday as promised." },
  { id: 793, cat: "Phrasal verbs", lvl: "B2", en: "gear up for (something)", uk: "готуватись до чогось", ctx: "Активна підготовка", ex: "Let's gear up for Black Friday — creative refresh starts in 3 weeks." },
  { id: 794, cat: "Phrasal verbs", lvl: "B2", en: "head off (a problem)", uk: "запобігти проблемі / випередити її", ctx: "Зупинити до того як стане великою", ex: "Let's head off any tracking issues before launch — full QA tomorrow." },
  { id: 795, cat: "Phrasal verbs", lvl: "B2", en: "look into (something)", uk: "дослідити щось", ctx: "Розібратись в питанні", ex: "I'll look into the conversion drop and report back by EOD." },
  { id: 796, cat: "Phrasal verbs", lvl: "B2", en: "map out (a plan / a strategy)", uk: "розписати план / стратегію", ctx: "Задокументувати кроки", ex: "Let's map out the next 90 days before we get into tactics." },
  { id: 797, cat: "Phrasal verbs", lvl: "B2", en: "narrow down (options)", uk: "звужувати варіанти", ctx: "Йти від багатьох до кількох", ex: "Let's narrow down the targeting from 50 keywords to the top 10." },
  { id: 798, cat: "Phrasal verbs", lvl: "B2", en: "pan out", uk: "виявитись (як вийде)", ctx: "Чи спрацює якщо чекати", ex: "Let's see how PMax pans out before we add more budget." },
  { id: 799, cat: "Phrasal verbs", lvl: "B2", en: "ping (someone)", uk: "пингнути / швидко звернутися", ctx: "Швидке повідомлення в Slack", ex: "Just ping me on Slack if anything urgent comes up." },
  { id: 800, cat: "Phrasal verbs", lvl: "B2", en: "reach out (to someone)", uk: "звернутись до когось", ctx: "Ініціювати контакт", ex: "I'll reach out to the dev team about the tracking issue." },
  { id: 801, cat: "Phrasal verbs", lvl: "B2", en: "shake out (results / a process)", uk: "побачити як виглядає в підсумку", ctx: "Як події розгорнуться", ex: "Let's see how Q2 shakes out before deciding on Q3 budget." },
  { id: 802, cat: "Phrasal verbs", lvl: "B2", en: "stem from (a cause)", uk: "виходити з / походити від", ctx: "Походження проблеми", ex: "The drop stems from a tracking misfire two weeks ago — not actual performance." },
  { id: 803, cat: "Phrasal verbs", lvl: "B2", en: "take on (a project / responsibility)", uk: "взяти на себе (проект)", ctx: "Прийняти відповідальність", ex: "Happy to take on the email channel as well — feels like a natural fit." },
  { id: 804, cat: "Phrasal verbs", lvl: "B2", en: "take it offline", uk: "винести в особисту розмову (поза мітинг)", ctx: "Не обговорювати при всіх", ex: "Good question — let's take it offline so we don't derail the agenda." },
  { id: 805, cat: "Phrasal verbs", lvl: "B2", en: "throw in (something extra)", uk: "докинути / додати безкоштовно", ctx: "Бонус", ex: "I'll throw in a competitive analysis at no extra cost — useful context for you." },
  { id: 806, cat: "Phrasal verbs", lvl: "B2", en: "weed out (bad keywords / poor performers)", uk: "виполоти / прибрати погане", ctx: "Зачистити список", ex: "First step is to weed out keywords spending without conversions for 60+ days." },
  { id: 807, cat: "Phrasal verbs", lvl: "B2", en: "zero in on (the issue)", uk: "зосередитись точно на проблемі", ctx: "Сфокусуватись на головному", ex: "Let's zero in on the issue — Display performance, specifically the prospecting layer." },
  { id: 808, cat: "Phrasal verbs", lvl: "B2", en: "stack up against (competitors)", uk: "виглядати на фоні (конкурентів)", ctx: "Як ми виглядаємо порівняно", ex: "Let's see how we stack up against competitors on share of voice." },
  { id: 809, cat: "Phrasal verbs", lvl: "B2", en: "rule (something) out", uk: "виключити (як варіант)", ctx: "Прибрати з розгляду", ex: "We can rule out tracking issues — the data is clean. So it's a real performance drop." },

  // ====== BUSINESS IDIOMS ======
  { id: 820, cat: "Business idioms", lvl: "B2", en: "The ball is in your court.", uk: "М'яч на твоєму боці — твій хід.", ctx: "Чекаємо на твоє рішення/дію", ex: "I've sent the proposal — the ball is in your court now." },
  { id: 821, cat: "Business idioms", lvl: "B2", en: "On the back burner", uk: "На задньому плані / відкладено", ctx: "Менш пріоритетне", ex: "YouTube is on the back burner until Search is fully optimised." },
  { id: 822, cat: "Business idioms", lvl: "B2", en: "A moving target", uk: "Рухома мішень — постійно змінюється", ctx: "Ціль постійно змінюється", ex: "Performance benchmarks are a moving target — we update them quarterly." },

/* ============ STATE ============ */
const STORAGE_KEY = "client_english_progress_v1";
let state = {
  mode: "list",
  category: "All",
  search: "",
  level: "",
  learnedFilter: "",
  learned: new Set(JSON.parse(localStorage.getItem(STORAGE_KEY) || "[]")),
  flashIndex: 0,
  flashFlipped: false,
  quizIndex: 0,
  quizDirection: "uk-en",
  voiceURI: localStorage.getItem("voice_uri") || "",
  speechRate: parseFloat(localStorage.getItem("voice_rate") || "1")
};

/* ============ SPEECH SYNTHESIS ============ */
function loadVoices() {
  const select = document.getElementById("voiceSelect");
  if (!select) return;
  const voices = speechSynthesis.getVoices().filter(v => v.lang.startsWith("en"));
  if (voices.length === 0) { select.innerHTML = '<option>(loading…)</option>'; return; }
  // sort: prefer en-US, en-GB, en-AU
  const priority = (v) => {
    if (v.lang === "en-US") return 0;
    if (v.lang === "en-GB") return 1;
    if (v.lang === "en-AU") return 2;
    return 3;
  };
  voices.sort((a, b) => priority(a) - priority(b) || a.name.localeCompare(b.name));
  select.innerHTML = voices.map(v => {
    const label = `${v.name} (${v.lang})`;
    return `<option value="${v.voiceURI}">${label}</option>`;
  }).join("");
  // restore saved voice
  if (state.voiceURI && [...select.options].some(o => o.value === state.voiceURI)) {
    select.value = state.voiceURI;
  } else {
    state.voiceURI = select.value;
  }
  // also restore rate
  const rateSelect = document.getElementById("rateSelect");
  if (rateSelect) rateSelect.value = state.speechRate.toString();
}

function speak(text, btn) {
  if (!("speechSynthesis" in window)) {
    alert("Web Speech API не підтримується в цьому браузері. Спробуй Chrome/Edge.");
    return;
  }
  speechSynthesis.cancel();
  const utter = new SpeechSynthesisUtterance(text);
  const voices = speechSynthesis.getVoices();
  const v = voices.find(x => x.voiceURI === state.voiceURI);
  if (v) utter.voice = v;
  else utter.lang = "en-US";
  utter.rate = state.speechRate;
  utter.pitch = 1;
  if (btn) {
    document.querySelectorAll(".speak-btn.speaking").forEach(b => b.classList.remove("speaking"));
    btn.classList.add("speaking");
    utter.onend = () => btn.classList.remove("speaking");
    utter.onerror = () => btn.classList.remove("speaking");
  }
  speechSynthesis.speak(utter);
}

if ("speechSynthesis" in window) {
  speechSynthesis.onvoiceschanged = loadVoices;
  setTimeout(loadVoices, 100);
}

function saveProgress() {
  localStorage.setItem(STORAGE_KEY, JSON.stringify([...state.learned]));
  updateProgressBar();
}

function updateProgressBar() {
  const total = PHRASES.length;
  const learned = state.learned.size;
  const pct = total ? Math.round((learned / total) * 100) : 0;
  document.getElementById("learnedCount").textContent = learned;
  document.getElementById("totalCount").textContent = total;
  document.getElementById("progressFill").style.width = pct + "%";
  document.getElementById("progressPercent").textContent = pct + "%";
}

function getCategories() {
  const cats = ["All", ...new Set(PHRASES.map(p => p.cat))];
  return cats;
}

function renderNav() {
  const nav = document.getElementById("categoryNav");
  const cats = getCategories();
  nav.innerHTML = cats.map(c => {
    const count = c === "All" ? PHRASES.length : PHRASES.filter(p => p.cat === c).length;
    const learnedInCat = c === "All" ? state.learned.size : PHRASES.filter(p => p.cat === c && state.learned.has(p.id)).length;
    const isActive = state.category === c;
    return `<button class="${isActive ? 'active' : ''}" onclick="setCategory('${c.replace(/'/g, "\\'")}')">${c} <span class="count">${learnedInCat}/${count}</span></button>`;
  }).join("");
}

function setCategory(c) {
  state.category = c;
  renderNav();
  render();
}

function setMode(m, ev) {
  state.mode = m;
  document.querySelectorAll(".modes button").forEach(b => b.classList.remove("active"));
  if (ev && ev.target) ev.target.classList.add("active");
  render();
}

function getFiltered() {
  const q = state.search.trim().toLowerCase();
  return PHRASES.filter(p => {
    if (state.category !== "All" && p.cat !== state.category) return false;
    if (state.level && p.lvl !== state.level) return false;
    if (state.learnedFilter === "learned" && !state.learned.has(p.id)) return false;
    if (state.learnedFilter === "unlearned" && state.learned.has(p.id)) return false;
    if (q) {
      return (p.en.toLowerCase().includes(q) || p.uk.toLowerCase().includes(q) || p.ctx.toLowerCase().includes(q));
    }
    return true;
  });
}

function toggleLearned(id) {
  if (state.learned.has(id)) state.learned.delete(id);
  else state.learned.add(id);
  saveProgress();
  render();
}

function levelClass(lvl) {
  return "badge " + lvl.toLowerCase().replace("+", "plus");
}

function escapeHtml(s) {
  return s.replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;");
}

  if (items.length === 0) {

    return;
  }
  const html = `<div class="phrase-list">${items.map(p => `
    <div class="phrase ${state.learned.has(p.id) ? 'learned' : ''}">
      <div class="phrase-top">
        <div class="phrase-en">${escapeHtml(p.en)}</div>
      </div>
      <div class="phrase-uk">${escapeHtml(p.uk)}</div>
      <div class="phrase-meta">
        <span class="badge cat">${p.cat}</span>
        <span class="${levelClass(p.lvl)}">${p.lvl}</span>
      </div>
      <div class="phrase-context">${escapeHtml(p.ctx)}</div>
      <div class="phrase-example"><b>Приклад:</b> ${escapeHtml(p.ex)}</div>
      <div class="phrase-actions">
        <button class="speak-btn" onclick="speak(${JSON.stringify(p.en).replace(/"/g, '&quot;')}, this)">🔊 Listen</button>
        <button class="speak-btn" onclick="speak(${JSON.stringify(p.ex).replace(/"/g, '&quot;')}, this)">🔊 Example</button>
        <button class="icon-btn ${state.learned.has(p.id) ? 'active' : ''}" onclick="toggleLearned(${p.id})">
          ${state.learned.has(p.id) ? '✓ Вивчено' : '○ Позначити вивченим'}
        </button>
      </div>
    </div>`).join("")}</div>`;
  document.getElementById("content").innerHTML = html;
}

function renderFlashcards() {
  const items = getFiltered();
  if (items.length === 0) {
    document.getElementById("content").innerHTML = `<div class="empty">Немає карток за цими фільтрами.</div>`;
    return;
  }
  if (state.flashIndex >= items.length) state.flashIndex = 0;
  const p = items[state.flashIndex];
  const html = `
    <div class="flashcard-wrap">
      <div class="flashcard-counter">${state.flashIndex + 1} / ${items.length}</div>
      <div class="flashcard ${state.flashFlipped ? 'flipped' : ''}" onclick="flipCard()">
        ${state.flashFlipped ? `
          <div class="face-uk">${escapeHtml(p.uk)}</div>
          <div class="face-context">${escapeHtml(p.ctx)}</div>
          <div class="face-example">${escapeHtml(p.ex)}</div>
        ` : `
          <div class="face-en">${escapeHtml(p.en)}</div>
          <div style="margin-top: 14px; color: var(--muted); font-size: 13px;">Натисни щоб побачити переклад</div>
        `}
      </div>
      <div class="flashcard-controls">
        <button class="icon-btn" onclick="prevCard()">← Попередня</button>
        <button class="speak-btn" onclick="speak(${JSON.stringify(p.en).replace(/"/g, '&quot;')}, this)">🔊 Listen</button>
        <button class="speak-btn" onclick="speak(${JSON.stringify(p.ex).replace(/"/g, '&quot;')}, this)">🔊 Example</button>
        <button class="icon-btn ${state.learned.has(p.id) ? 'active' : ''}" onclick="toggleLearned(${p.id})">
          ${state.learned.has(p.id) ? '✓ Вивчено' : '○ Позначити вивченим'}
        </button>
        <button class="icon-btn" onclick="nextCard()">Наступна →</button>
      </div>
      <div class="phrase-meta" style="margin-top: 8px;">
        <span class="badge cat">${p.cat}</span>
        <span class="${levelClass(p.lvl)}">${p.lvl}</span>
      </div>
    </div>`;
  document.getElementById("content").innerHTML = html;
}

function flipCard() { state.flashFlipped = !state.flashFlipped; renderFlashcards(); }
function nextCard() {
  const items = getFiltered();
  state.flashIndex = (state.flashIndex + 1) % items.length;
  state.flashFlipped = false;
  renderFlashcards();
}
function prevCard() {
  const items = getFiltered();
  state.flashIndex = (state.flashIndex - 1 + items.length) % items.length;
  state.flashFlipped = false;
  renderFlashcards();
}

function renderQuiz() {
  const items = getFiltered();
  if (items.length === 0) {
    document.getElementById("content").innerHTML = `<div class="empty">Немає фраз для квізу за цими фільтрами.</div>`;
    return;
  }
  if (state.quizIndex >= items.length) state.quizIndex = 0;
  const p = items[state.quizIndex];
  const html = `
    <div class="quiz-card">
      <div class="quiz-prompt-label">Переклади англійською:</div>
      <div class="quiz-prompt">${escapeHtml(p.uk)}</div>
      <input class="quiz-input" id="quizInput" placeholder="Type your answer..." onkeydown="if(event.key==='Enter')checkQuiz(${p.id})" />
      <div class="quiz-feedback" id="quizFeedback"></div>
      <div style="margin-top: 16px; display: flex; gap: 8px; flex-wrap: wrap;">
        <button class="icon-btn" onclick="checkQuiz(${p.id})">Перевірити</button>
        <button class="icon-btn" onclick="showQuizAnswer(${p.id})">Показати відповідь</button>
        <button class="icon-btn" onclick="nextQuiz()">Наступна →</button>
      </div>
      <div style="margin-top: 12px; font-size: 12px; color: var(--muted);">
        ${state.quizIndex + 1} / ${items.length} · <span class="${levelClass(p.lvl)}">${p.lvl}</span> · ${p.cat}
      </div>
    </div>`;
  document.getElementById("content").innerHTML = html;
  setTimeout(() => document.getElementById("quizInput")?.focus(), 50);
}

function normalize(s) {
  return s.toLowerCase().replace(/[.,!?;:'"`-]/g, "").replace(/\s+/g, " ").trim();
}

function checkQuiz(id) {
  const p = PHRASES.find(x => x.id === id);
  const input = document.getElementById("quizInput").value;
  const fb = document.getElementById("quizFeedback");
  fb.classList.add("show");
  if (normalize(input) === normalize(p.en)) {
    fb.className = "quiz-feedback show correct";
    fb.innerHTML = `✓ Правильно! Чудово. <button class="speak-btn" style="margin-left:8px" onclick="speak(${JSON.stringify(p.en).replace(/"/g, '&quot;')}, this)">🔊</button>`;
    state.learned.add(id);
    saveProgress();
  } else {
    fb.className = "quiz-feedback show incorrect";
    fb.innerHTML = `Майже. Очікувана відповідь:<div class="answer">${escapeHtml(p.en)} <button class="speak-btn" style="margin-left:8px" onclick="speak(${JSON.stringify(p.en).replace(/"/g, '&quot;')}, this)">🔊</button></div>`;
  }
  speak(p.en);
}

function showQuizAnswer(id) {
  const p = PHRASES.find(x => x.id === id);
  const fb = document.getElementById("quizFeedback");
  fb.className = "quiz-feedback show incorrect";
  fb.innerHTML = `Відповідь:<div class="answer">${escapeHtml(p.en)}</div>`;
}

function nextQuiz() {
  const items = getFiltered();
  state.quizIndex = (state.quizIndex + 1) % items.length;
  renderQuiz();
}

function renderDialogues() {
  const html = DIALOGUES.map(d => `
    <div class="dialogue">
      <h3>${d.title}</h3>
      <div class="scenario">${d.scenario}</div>
      ${d.turns.map(t => `
        <div class="turn">
          <div class="who ${t.who === 'you' ? 'you' : ''}">${t.who === 'you' ? 'YOU' : 'CLIENT'}</div>
          <div class="text">${t.text}</div>
        </div>
      `).join("")}
    </div>
  `).join("");
  document.getElementById("content").innerHTML = html || `<div class="empty">No dialogues yet.</div>`;
}

function render() {
  state.search = document.getElementById("search").value;
  state.level = document.getElementById("levelFilter").value;
  state.learnedFilter = document.getElementById("learnedFilter").value;
  if (state.mode === "list") renderList();
  else if (state.mode === "flashcards") renderFlashcards();
  else if (state.mode === "quiz") renderQuiz();
  else if (state.mode === "dialogues") renderDialogues();
  renderNav();
}

function randomPhrase() {
  const items = getFiltered();
  if (items.length === 0) return;
  const p = items[Math.floor(Math.random() * items.length)];
  state.flashIndex = items.indexOf(p);
  state.flashFlipped = false;
  setMode("flashcards");
  document.querySelectorAll(".modes button").forEach(b => b.classList.remove("active"));
  document.querySelectorAll(".modes button")[1].classList.add("active");
}

function resetProgress() {
  if (!confirm("Скинути весь прогрес? Цю дію не можна скасувати.")) return;
  state.learned = new Set();
  saveProgress();
  render();
}

/* ============ INIT ============ */
updateProgressBar();
renderNav();
render();
</script>
</body>
</html>
